<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<title>Focus</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>:root{
  --bg:#ffffff;--bg2:#f7f7f5;--bg3:#efeeeb;--card:#ffffff;
  --ink:#37352f;--mute:#787774;--faint:#aeaca6;
  --line:rgba(55,53,47,.1);--line2:rgba(55,53,47,.18);--hover:rgba(55,53,47,.06);
  --accent:#2383e2;--accent-soft:rgba(35,131,226,.1);
  --g1:#2f7d5b;--g2:#6fb391;--g3:#c4e0d2;
  --play:#1f9a60;--play-hi:#23a86a;--play-run:#176a47;
  --red:#d44c47;--amber:#cb912f;--pause:#e9a820;--pause-hi:#f0b63a;--pause-ink:#3b2a05;
  --shadow:0 1px 2px rgba(15,15,15,.06),0 8px 24px rgba(15,15,15,.12);
  --tag-green:#dbeddb;--tag-green-ink:#1c3829;--tag-gray:#e3e2e0;--tag-gray-ink:#32302c;
  --tag-yellow:#fdecc8;--tag-yellow-ink:#402c1b;--tag-blue:#d3e5ef;--tag-blue-ink:#183347;
  color-scheme:light;
}
:root[data-theme=dark]{
  --bg:#191919;--bg2:#202020;--bg3:#2a2a2a;--card:#202020;
  --ink:#ebebea;--mute:#9b9a97;--faint:#6b6b68;
  --line:rgba(255,255,255,.09);--line2:rgba(255,255,255,.18);--hover:rgba(255,255,255,.06);
  --accent:#529cca;--accent-soft:rgba(82,156,202,.16);
  --g1:#4aa57c;--g2:#3a7d5e;--g3:#2b4a3c;
  --play:#2fae72;--play-hi:#38bd7e;--play-run:#23885a;
  --red:#ff7369;--amber:#ffb94f;--pause:#f0b43c;--pause-hi:#f6c35a;--pause-ink:#2e2004;
  --shadow:0 1px 2px rgba(0,0,0,.4),0 10px 28px rgba(0,0,0,.5);
  --tag-green:#243d30;--tag-green-ink:#a9dcc0;--tag-gray:#373737;--tag-gray-ink:#d4d3d0;
  --tag-yellow:#43372a;--tag-yellow-ink:#f2d6a7;--tag-blue:#233a4a;--tag-blue-ink:#a7cfe6;
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 Inter,-apple-system,BlinkMacSystemFont,"Segoe UI",system-ui,sans-serif;-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit}
button{background:none;border:0;padding:0;cursor:pointer;border-radius:6px}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
h1,h2,h3,p{margin:0}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--mute)}.faint{color:var(--faint)}
[contenteditable]{outline:none;border-radius:3px;cursor:text}
[contenteditable]:focus{box-shadow:0 1px 0 var(--line2);background:transparent}
[data-ph]:empty:before{content:attr(data-ph);color:var(--faint)}
.btn{display:inline-flex;align-items:center;gap:6px;padding:4px 9px;border-radius:6px;color:var(--mute);font-size:13px}
.btn:hover{background:var(--hover);color:var(--ink)}
.btn.line{border:1px solid var(--line2);color:var(--ink)}
.btn.solid{background:var(--ink);color:var(--bg)}
.iconbtn{width:26px;height:26px;display:inline-grid;place-items:center;color:var(--mute)}
.iconbtn:hover{background:var(--hover);color:var(--ink)}
.iconbtn svg{width:15px;height:15px}

/* cabecera */
header.top{position:sticky;top:0;z-index:30;height:48px;display:flex;align-items:center;gap:6px;padding:0 18px;background:var(--bg);border-bottom:1px solid var(--line)}
.brand{font-weight:650;font-size:15px;letter-spacing:-.2px;margin-right:14px;display:flex;align-items:center;gap:8px}
.brand i{width:18px;height:18px;border-radius:5px;background:var(--ink);display:inline-block;position:relative}
.brand i:after{content:"";position:absolute;inset:5px;border-radius:50%;background:var(--bg)}
nav.tabs{display:flex;gap:2px;flex:1}
nav.tabs button{padding:5px 11px;color:var(--mute);font-weight:500;border-radius:6px}
nav.tabs button:hover{background:var(--hover);color:var(--ink)}
nav.tabs button[aria-current=page]{background:var(--hover);color:var(--ink)}
.runchip{display:inline-flex;align-items:center;gap:7px;padding:4px 10px;border-radius:14px;background:var(--tag-green);color:var(--tag-green-ink);font-size:12.5px;max-width:340px;white-space:nowrap}
.runchip b{font-variant-numeric:tabular-nums}.runchip span{overflow:hidden;text-overflow:ellipsis}
.runchip.over{background:#f5d9d6;color:#7a2a24}
:root[data-theme=dark] .runchip.over{background:#4a2b28;color:#ffb3ab}
.dot{width:7px;height:7px;border-radius:50%;background:currentColor;animation:pulse 1.6s infinite}
@keyframes pulse{50%{opacity:.35}}
@media(prefers-reduced-motion:reduce){.dot{animation:none}}

main{min-height:calc(100dvh - 48px - var(--rb,0px))}

/* etiquetas */
.tag{display:inline-flex;align-items:center;padding:0 7px;border-radius:4px;font-size:12px;line-height:20px;font-weight:500;white-space:nowrap}
.tag.s-activo{background:var(--tag-green);color:var(--tag-green-ink)}
.tag.s-en-cola,.tag.s-esperando{background:var(--bg3);color:var(--faint)}
.tag.s-pausado{background:var(--tag-yellow);color:var(--tag-yellow-ink)}
.tag.s-completado{background:var(--tag-blue);color:var(--tag-blue-ink)}
.ico{display:inline-block;width:1.25em;text-align:center;font-family:"Apple Color Emoji","Segoe UI Emoji","Noto Color Emoji",sans-serif;font-style:normal}

/* barra de progreso */
.prog{height:5px;border-radius:3px;background:var(--bg3);display:flex;overflow:hidden;min-width:60px}
.prog i{display:block;height:100%}.prog i:nth-child(1){background:var(--g1)}.prog i:nth-child(2){background:var(--g2)}.prog i:nth-child(3){background:var(--g3)}

/* tareas */
.tasks{display:block}
.task{display:grid;grid-template-columns:24px 16px minmax(0,1fr) 64px 50px 68px 26px;align-items:center;column-gap:2px;min-height:34px;padding:2px 6px 2px 0;border-radius:6px;position:relative}
.task:hover{background:var(--hover)}
.task.picked{background:var(--accent-soft)}
.task:focus{outline:none}
.grip{width:16px;height:22px;display:grid;place-items:center;color:var(--faint);opacity:0;cursor:grab;font-size:12px;user-select:none}
.task:hover .grip,.task.picked .grip{opacity:1}
.check{width:16px;height:16px;border:1.5px solid var(--line2);border-radius:4px;margin-left:0;display:grid;place-items:center;background:transparent}
.check:hover{border-color:var(--mute)}
.check.on{background:var(--accent);border-color:var(--accent)}
.check.on:after{content:"";width:4px;height:8px;border:solid #fff;border-width:0 2px 2px 0;transform:rotate(45deg) translate(-1px,-1px)}
.tmain{min-width:0;padding:3px 0}
.tname{display:block;overflow-wrap:anywhere;padding:0 2px}
.tsub{display:block;font-size:12px;color:var(--mute);padding:0 2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.task.done .tname{text-decoration:line-through;color:var(--mute)}
.tmin{display:block;text-align:right;color:var(--ink);font-variant-numeric:tabular-nums;font-size:13px;padding:1px 3px;white-space:nowrap;border-radius:4px;cursor:text}
.tmin:after{content:" min";color:var(--faint)}
.tmin:hover{background:var(--hover)}
.tmin:focus{background:var(--accent-soft);box-shadow:none}
.today{font-size:12px;color:var(--faint);opacity:0;padding:1px 6px;border-radius:4px;text-align:center}
.task:hover .today,.task.picked .today{opacity:1}
.today.on{opacity:1;color:var(--g1);font-weight:500;background:color-mix(in srgb,var(--g1) 14%,transparent)}
.today:hover{background:var(--line)}
.today.on:hover{background:color-mix(in srgb,var(--g1) 24%,transparent)}
.tplay{width:24px;height:24px;display:grid;place-items:center;color:var(--mute);opacity:0}
.tplay svg{width:12px;height:12px}
.tplay.on{opacity:1}
.tplay:hover{background:var(--line);color:var(--ink)}
.task.running .tname{font-weight:600}
.addrow{display:flex;align-items:center;gap:6px;padding:5px 8px 5px 44px;color:var(--faint);font-size:13px;width:100%;text-align:left;border-radius:6px}
.addrow:hover{background:var(--hover);color:var(--mute)}
.drop-before:before,.drop-after:after{content:"";position:absolute;left:0;right:0;height:2px;background:var(--accent);border-radius:2px;pointer-events:none}
.drop-before:before{top:-1px}.drop-after:after{bottom:-1px}
.drop-in{background:var(--accent-soft)}
.dragging{opacity:.4}

/* objetivos y secciones */
.obj{margin:0 0 6px}
.ohead{display:flex;align-items:center;gap:6px;padding:4px 0;position:relative}
.ohead .lines{margin-left:-18px}
.caret{width:22px;height:22px;display:grid;place-items:center;color:var(--mute);transition:transform .12s}
.caret:hover{background:var(--hover)}
.caret.open{transform:rotate(90deg)}
.caret svg{width:12px;height:12px}
.iconpick{width:28px;height:28px;display:grid;place-items:center;font-size:18px;border-radius:6px}
.iconpick:hover{background:var(--hover)}
.oname{font-size:16px;font-weight:600;letter-spacing:-.1px;flex:0 1 auto;min-width:40px;padding:0 2px}
.ometa{display:flex;align-items:center;gap:8px;margin-left:auto;color:var(--mute);font-size:12.5px}
.ometa .prog{width:96px}
.pct{width:34px;text-align:right}
.oprops{display:flex;flex-wrap:wrap;gap:2px 16px;padding:0 0 6px 54px;font-size:12.5px;color:var(--mute)}
.oprops .p{display:inline-flex;align-items:center;gap:5px;padding:1px 4px;border-radius:4px}
.oprops button.p:hover{background:var(--hover);color:var(--ink)}
.oprops .p b{font-weight:500;color:var(--faint)}
.oprops .p span[contenteditable]{min-width:12px}
.lines{width:14px;height:14px;display:inline-block;flex:none;cursor:grab;opacity:0;background:linear-gradient(var(--faint),var(--faint)) 1px 4px/12px 1.5px no-repeat,linear-gradient(var(--faint),var(--faint)) 1px 8px/12px 1.5px no-repeat}
.sec:hover .lines,.ohead:hover .lines,.pitem:hover .lines{opacity:.85}
.sec{display:flex;align-items:center;gap:6px;padding:10px 0 2px 24px;position:relative}
.sec .lines{margin-left:-20px}
.sname{font-size:13px;font-weight:600;color:var(--ink);padding:0 2px}
.smeta{font-size:12px;color:var(--faint)}
.sx{margin-left:auto;opacity:0;color:var(--faint);width:22px;height:22px;display:grid;place-items:center;font-size:12px}
.sec:hover .sx{opacity:1}.sx:hover{background:var(--hover);color:var(--red)}
.sechead-spacer{height:4px}
.donebox{padding:4px 8px 6px 44px}
.donebox button{color:var(--faint);font-size:12.5px}.donebox button:hover{color:var(--mute)}
.obj .tasks{padding-left:28px}
.obj-body{padding-left:0}

.pdot{width:8px;height:8px;border-radius:50%;background:var(--pc)}
.pprops{display:flex;flex-wrap:wrap;align-items:center;gap:4px 18px;margin:10px 0 4px;color:var(--mute);font-size:13px}
.pprops .p{display:inline-flex;align-items:center;gap:6px;padding:2px 6px;border-radius:5px}
.pprops button.p:hover{background:var(--hover);color:var(--ink)}
.swatch{width:12px;height:12px;border-radius:50%;background:var(--pc);display:inline-block}
.pdesc{display:block;color:var(--mute);padding:0 2px;margin-top:6px;max-width:70ch}
.subtabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:22px 0 14px}
.subtabs button{padding:6px 10px;color:var(--mute);border-radius:0;border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500}
.subtabs button:hover{color:var(--ink)}
.subtabs button[aria-current=true]{color:var(--ink);border-bottom-color:var(--ink)}
.notes{width:100%;min-height:320px;border:0;background:transparent;resize:none;outline:none;line-height:1.7;font-size:15px}
.empty{color:var(--faint);padding:18px 0}

/* hoy */
.col{padding:18px 20px 40px;overflow:auto;border-right:1px solid var(--line);min-width:0}
.colhead{display:flex;align-items:center;gap:6px;margin-bottom:10px}
.colhead h2{font-size:20px;font-weight:700;letter-spacing:-.4px;flex:1}
.colhead .sub{font-size:12.5px;color:var(--mute)}
.dayhint{font-size:12px;color:var(--faint);margin:6px 0 10px}
.capbar{display:flex;height:8px;border-radius:4px;overflow:hidden;background:var(--bg3);margin:10px 0 6px}
.capbar i:nth-child(1){background:var(--g1)}.capbar i:nth-child(2){background:var(--g3)}
.capbar.over i:nth-child(2){background:var(--red)}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:8px 0 0}
.stat small{display:block;color:var(--mute);font-size:12px}.stat b{font-size:16px;font-weight:600}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:16px}
.col .card{margin-bottom:12px}
.card h3{font-size:13px;font-weight:600;color:var(--mute);margin-bottom:10px}
.exec{text-align:center}
.exec .where{display:flex;justify-content:center;align-items:center;gap:6px;color:var(--mute);font-size:13px}
.exec h2{font-size:21px;line-height:1.25;margin:8px 0 2px;font-weight:650;letter-spacing:-.3px;overflow-wrap:anywhere}
.clock{font-size:clamp(46px,5.4vw,70px);font-weight:650;letter-spacing:-2.5px;font-variant-numeric:tabular-nums;line-height:1.1;margin:12px 0 0}
.clock.over{color:var(--red)}
.clocklabel{font-size:12px;color:var(--mute)}.clocklabel.over{color:var(--red)}
.timer-controls{display:flex;flex-direction:column;align-items:center;gap:8px;margin:16px 0 6px}
.play-round{width:92px;height:92px;border-radius:50%;display:grid;place-items:center;color:#fff;background:var(--play);box-shadow:0 8px 22px rgba(31,154,96,.32),inset 0 -3px 0 rgba(0,0,0,.14);transition:transform .12s,background .12s}
.play-round svg{width:40px;height:40px}
.play-round:not(.is-running) svg{transform:none}
.play-round:hover{background:var(--play-hi);transform:scale(1.04)}
.play-round:active{transform:scale(.97)}
.play-round.is-running{background:var(--pause);color:var(--pause-ink);box-shadow:0 0 0 8px color-mix(in srgb,var(--pause) 22%,transparent),0 8px 22px color-mix(in srgb,var(--pause) 40%,transparent),inset 0 -3px 0 rgba(0,0,0,.12)}
.play-round.is-running:hover{background:var(--pause-hi)}
.finish-link{display:inline-flex;align-items:center;gap:5px;color:var(--accent);font-size:13px;font-weight:600;padding:4px 10px;border-radius:14px}
.finish-link svg{width:15px;height:15px}.finish-link:hover{background:var(--accent-soft)}
.timer-done{display:inline-flex;align-items:center;gap:6px;color:var(--g1);font-weight:600}.timer-done svg{width:18px;height:18px}
@media(prefers-reduced-motion:reduce){.play-round{transition:none}}
.est{font-size:13px;color:var(--mute)}
.exec .tools{display:flex;justify-content:center;gap:4px;margin-top:6px}
.noteinput{width:100%;margin-top:8px;border:0;border-bottom:1px solid var(--line);background:transparent;padding:6px 2px;outline:none;font-size:13px}
.noteinput:focus{border-bottom-color:var(--line2)}
.pauseitem{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:13px;text-align:left}
.pauseitem span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brk{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:13px}
.brk .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.brk .bar{height:4px;border-radius:2px;background:var(--pc);width:var(--w)}

/* calendario */
.calhead{display:flex;align-items:center;gap:4px;margin-bottom:8px}
.calhead h2{flex:1;font-size:20px;font-weight:700;letter-spacing:-.4px}
.seg{display:inline-flex;background:var(--bg3);border-radius:6px;padding:2px}
.seg button{padding:2px 9px;font-size:12.5px;color:var(--mute);border-radius:4px}
.seg button[aria-pressed=true]{background:var(--bg);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.12)}
.calscroll{overflow:auto;flex:1;min-height:0;margin:0 -4px;padding-right:4px}
.wk h4{text-align:center;font-size:12px;color:var(--mute);font-weight:500;padding:3px 0;position:sticky;top:0;background:var(--bg);z-index:3}
.wk h4.is-today{color:var(--accent);font-weight:700}
.daycol.drop-cal{background-color:var(--accent-soft)}
.hour{position:absolute;left:-40px;font-size:11px;color:var(--faint);transform:translateY(-7px)}
.block{position:absolute;text-align:left;padding:2px 6px;font-size:12px;line-height:1.25;border-radius:5px;overflow:hidden;background:color-mix(in srgb,var(--pc) 24%,var(--bg));border-left:3px solid var(--pc);color:var(--ink);min-height:9px}
.block.planned{background:transparent;border:1px dashed var(--pc);border-left:3px solid var(--pc);cursor:grab}
.block b{display:block;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.block small{color:var(--mute);font-size:11px}
.nowline{position:absolute;left:0;right:0;height:2px;background:var(--red);pointer-events:none;z-index:2}
.nowline:before{content:"";position:absolute;left:-4px;top:-3px;width:8px;height:8px;border-radius:50%;background:var(--red)}
.legend{font-size:12px;color:var(--faint);margin-top:8px}

/* menu flotante */
#pop{position:fixed;z-index:80;background:var(--card);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);padding:5px;min-width:190px;max-width:340px;max-height:70vh;overflow:auto;display:none}
#pop.open{display:block}
.pi{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:5px 8px;border-radius:5px;font-size:13.5px}
.pi:hover{background:var(--hover)}.pi.sel{font-weight:600}
.pi.danger{color:var(--red)}
.pl{padding:5px 8px 2px;font-size:11px;letter-spacing:.05em;text-transform:uppercase;color:var(--faint);font-weight:600}
.emojis{display:grid;grid-template-columns:repeat(8,1fr);gap:2px;padding:4px;width:290px}
.emojis button{font-size:20px;padding:4px 0;border-radius:6px;text-align:center}.emojis button:hover{background:var(--hover)}
.swatches{display:flex;flex-wrap:wrap;gap:8px;padding:8px;width:230px}
.swatches button{width:24px;height:24px;border-radius:50%;background:var(--pc);border:2px solid transparent}
.swatches button[aria-pressed=true]{outline:2px solid var(--ink);outline-offset:2px}
.pinput{display:flex;align-items:center;gap:8px;padding:4px 8px;font-size:13px}
.pinput label{width:62px;color:var(--mute)}
.pinput input{flex:1;border:1px solid var(--line2);background:var(--bg);border-radius:5px;padding:3px 6px;min-width:0}
.psearch{width:calc(100% - 10px);margin:4px 5px 6px;border:1px solid var(--line2);background:var(--bg);border-radius:6px;padding:5px 8px;outline:none}
.poplist{max-height:50vh;overflow:auto}
#notice{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:8px 14px;border-radius:8px;font-size:13px;z-index:90;display:flex;gap:12px;align-items:center;box-shadow:var(--shadow);max-width:90vw}
#notice:empty{display:none}
#notice button{color:var(--bg);font-weight:700;text-decoration:underline;padding:0 2px}

/* analítica */
.an{padding:28px clamp(20px,4vw,56px) 70px;max-width:1280px;margin:0 auto}
.anhead{display:flex;align-items:center;gap:10px;margin-bottom:18px}
.anhead h1{font-size:30px;font-weight:700;letter-spacing:-.7px;flex:1}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:14px}
.kpi small{display:block;color:var(--mute);font-size:12.5px}.kpi b{display:block;font-size:26px;font-weight:650;letter-spacing:-.6px;margin-top:2px;font-variant-numeric:tabular-nums}
.kpi span{font-size:12px;color:var(--faint)}
.angrid{display:grid;grid-template-columns:repeat(12,1fr);gap:14px}
.angrid .card{min-width:0}
.c8{grid-column:span 8}.c4{grid-column:span 4}.c6{grid-column:span 6}.c12{grid-column:span 12}
@media(max-width:1000px){.c8,.c4,.c6{grid-column:span 12}}
.card h3.t{font-size:14px;color:var(--ink);font-weight:600;margin:0 0 2px}
.card p.d{font-size:12.5px;color:var(--mute);margin-bottom:10px}
svg.chart{width:100%;height:auto;display:block;overflow:visible}
svg.chart text{fill:var(--mute);font-size:11px;font-family:inherit}
svg.chart .grid{stroke:var(--line);stroke-width:1}
svg.chart .cap{stroke:var(--ink);stroke-width:1.5;stroke-dasharray:4 3;fill:none;opacity:.55}
.lg{display:flex;flex-wrap:wrap;gap:4px 14px;margin-top:10px;font-size:12.5px;color:var(--mute)}
.lg span{display:inline-flex;align-items:center;gap:6px}.lg i{width:10px;height:10px;border-radius:3px;background:var(--pc)}
.donutwrap{display:flex;gap:18px;align-items:center;flex-wrap:wrap}
.donutwrap svg{width:170px;flex:none}
.donutwrap ul{list-style:none;margin:0;padding:0;flex:1;min-width:150px}
.donutwrap li{display:flex;align-items:center;gap:8px;padding:3px 0;font-size:13px}
.donutwrap li .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb{display:flex;align-items:center;gap:10px;padding:6px 0;font-size:13px}
.hb .nm{width:34%;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.hb .trk{flex:1;height:10px;border-radius:5px;background:var(--bg3);display:flex;overflow:hidden}
.hb .trk i{display:block;height:100%}.hb .trk i:nth-child(1){background:var(--pc)}.hb .trk i:nth-child(2){background:color-mix(in srgb,var(--pc) 35%,var(--bg3))}
.hb .v{width:118px;text-align:right;color:var(--mute);font-size:12.5px;font-variant-numeric:tabular-nums}
.logrow{display:flex;gap:10px;padding:5px 0;border-bottom:1px solid var(--line);font-size:13px}
.logrow:last-child{border-bottom:0}.logrow .t{width:104px;color:var(--mute);font-variant-numeric:tabular-nums;flex:none}.logrow .nm{flex:1;min-width:0}.logrow .d{color:var(--mute)}

/* inbox */
.inbox{max-width:720px;margin:0 auto;padding:36px 22px 80px}
.inbox h1{font-size:30px;font-weight:700;letter-spacing:-.7px;margin-bottom:4px}
.capture{display:flex;gap:8px;align-items:center;margin:18px 0 10px;border:1px solid var(--line2);border-radius:10px;padding:6px 8px 6px 14px;background:var(--card)}
.capture:focus-within{border-color:var(--accent)}
.capture input{flex:1;border:0;background:transparent;outline:none;font-size:15px;min-width:0}
.mic.on{background:var(--red);color:#fff}
.irow{display:flex;align-items:center;gap:8px;padding:8px 4px;border-bottom:1px solid var(--line)}
.irow .tx{flex:1;min-width:0;padding:0 2px}
.irow .x{opacity:0;color:var(--faint)}.irow:hover .x{opacity:1}.irow .x:hover{color:var(--red)}

/* ===== v5 ===== */
.tasks{display:block}
.ins{display:block;position:relative;height:0;width:100%;z-index:2;border-radius:0}
.ins i{position:absolute;left:0;right:0;top:-7px;height:14px;cursor:pointer;opacity:0;transition:opacity .08s}
.ins i:before{content:"";position:absolute;left:34px;right:6px;top:6px;height:2px;border-radius:2px;background:var(--accent);opacity:.5}
.ins i:after{content:"+";position:absolute;left:12px;top:-1px;width:16px;height:16px;border-radius:50%;background:var(--accent);color:#fff;font:600 13px/16px Inter,sans-serif;text-align:center}
.ins:hover i{opacity:1}
.ins.secins i{top:-9px;height:18px}
.ins.secins i:before{top:8px}
.ins.secins i:after{top:1px}
.dnd .ins{pointer-events:none}

/* play de cada tarea: mismo estilo que el global */
.tplay{width:24px;height:24px;border-radius:50%;background:transparent;color:color-mix(in srgb,var(--mute) 45%,transparent);display:grid;place-items:center;opacity:1;transition:background .12s,color .12s}
.tplay svg{width:11px;height:11px}
.tplay:not(.on) svg{transform:none}
.tplay:not(.on):hover{background:var(--play);color:#fff;box-shadow:0 1px 3px rgba(31,154,96,.35)}
.tplay.on{opacity:1;background:var(--pause);color:var(--pause-ink);box-shadow:0 1px 3px color-mix(in srgb,var(--pause) 50%,transparent)}
.tplay.on:hover{background:var(--pause-hi);color:var(--pause-ink)}

/* tarjetas de objetivo: cabecera con color suave, cuerpo blanco */
.bubbles{display:grid;grid-template-columns:minmax(0,1fr);gap:20px;align-items:start}
.bubble{position:relative;background:var(--card);border:1px solid color-mix(in srgb,var(--pc) 16%,var(--line));border-radius:24px;overflow:hidden;min-width:0}
.bubble.drop-before,.bubble.drop-after{box-shadow:0 0 0 2px var(--accent)}
.bubble.drop-before:before,.bubble.drop-after:after{display:none}
.bhead{position:relative;padding:22px 26px 20px;background:color-mix(in srgb,var(--pc) 13%,var(--card))}
.bhead>.lines{position:absolute;left:8px;top:26px;margin:0}
.bubble:hover .bhead>.lines{opacity:.85}
.bh1{display:flex;align-items:flex-start;gap:12px}
.bt{display:flex;flex-direction:column;min-width:0;flex:1;gap:3px}
.bt .oname{font-size:27px;line-height:1.15;font-weight:700;letter-spacing:-.6px;padding:0 2px;flex:none;overflow-wrap:anywhere;min-width:40px}
.bproj{font-size:13px;color:var(--mute);padding:0 2px}
.bh1 .tag{margin-top:6px}
.bh1 .iconbtn{margin-top:4px}
.bprog{display:flex;align-items:center;gap:12px;margin-top:16px;font-size:13px}
.bprog .prog{flex:1;height:9px;border-radius:5px;background:color-mix(in srgb,var(--pc) 14%,var(--bg3));max-width:380px}
.bprog b{font-size:15px;font-weight:650}
.chips2{display:flex;flex-wrap:wrap;gap:8px;margin-top:14px}
.chipi{font-size:12.5px;padding:3px 11px;border-radius:999px;background:color-mix(in srgb,var(--pc) 10%,var(--card));color:var(--ink);font-variant-numeric:tabular-nums}
.chipi.now{background:color-mix(in srgb,var(--g1) 18%,var(--card));color:var(--g1);font-weight:600}
.bbody{padding:10px 16px 14px}
.bubble .oprops{padding:4px 6px 8px}
.bubble .sec{padding:14px 6px 2px 24px}
.bubble .sec .lines{margin-left:-20px}
.bubble .sec.ro{padding-left:8px}
.bubble .tasks{padding-left:0}
.bubble .addrow{padding-left:10px;margin-top:2px}
.bubble .donebox{padding:4px 10px 6px}
.viewall{display:flex;align-items:center;justify-content:center;gap:6px;margin:12px auto 2px;padding:7px 18px;border-radius:999px;color:color-mix(in srgb,var(--ac) 70%,var(--ink));font-size:13px;font-weight:550;background:color-mix(in srgb,var(--ac) 12%,var(--card))}
.viewall:hover{color:var(--ink);background:color-mix(in srgb,var(--ac) 22%,var(--card))}
.viewall span{font-size:11px}

/* proyectos */
.projview{min-height:calc(100dvh - 48px - var(--rb,0px))}
.apills{display:flex;flex-wrap:wrap;gap:10px;padding:18px clamp(18px,3vw,40px) 16px}
.apill{display:inline-flex;align-items:center;gap:10px;padding:12px 20px;border-radius:14px;background:color-mix(in srgb,var(--ac) 15%,var(--bg));color:var(--ink);font-size:15px;font-weight:550;transition:background .1s}
.apill:hover{background:color-mix(in srgb,var(--ac) 24%,var(--bg))}
.apill .cnt{font-size:12.5px;color:var(--mute);font-weight:500}
.apill[aria-current=true]{background:color-mix(in srgb,var(--ac) 38%,var(--bg));font-weight:700}
.areapane{background:color-mix(in srgb,var(--ac) 8%,var(--bg));min-height:calc(100dvh - 130px);border-top-left-radius:22px;border-top-right-radius:22px;margin:0 clamp(8px,1.4vw,18px)}
.pane-in{padding:26px clamp(16px,2.6vw,38px) 90px}
.phead{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.ptxt{flex:1;min-width:0}
.ptitle{font-size:32px;font-weight:700;letter-spacing:-.8px;line-height:1.15;display:block;padding:0 2px}
.pdesc{display:block;color:var(--mute);padding:0 2px;margin-top:4px;max-width:70ch}
button.p.areacolor{display:inline-flex;align-items:center;gap:6px;padding:5px 11px;border-radius:9px;color:var(--mute);font-size:13px}
button.p.areacolor:hover{background:var(--hover);color:var(--ink)}
.swatch{width:12px;height:12px;border-radius:50%;background:var(--pc);display:inline-block}
.split{display:grid;grid-template-columns:minmax(300px,390px) minmax(0,1fr);gap:26px;align-items:start}
.rail{display:flex;flex-direction:column;gap:22px;position:sticky;top:60px;max-height:calc(100dvh - 80px);overflow:auto;padding:2px 4px 20px 2px}
.rgroup{display:flex;flex-direction:column;gap:10px}
.rgname{display:flex;align-items:baseline;gap:8px;text-align:left;padding:2px 6px;border-radius:8px}
.rgname:hover,.rgname[aria-current=true]{background:var(--hover)}
.rgname h2{font-size:17px;font-weight:700;letter-spacing:-.3px}
.rgname small{color:var(--faint);font-size:12px}
.ocard{display:block;text-align:left;width:100%;background:var(--card);border:1px solid color-mix(in srgb,var(--pc) 16%,var(--line));border-radius:20px;overflow:hidden;transition:transform .1s,box-shadow .1s}
.ocard:hover{transform:translateY(-1px);box-shadow:0 6px 16px rgba(15,15,15,.08)}
.ocard[aria-current=true]{box-shadow:0 0 0 2px var(--pc)}
.oc-top{display:flex;align-items:flex-start;gap:10px;padding:16px 18px 14px;background:color-mix(in srgb,var(--pc) 15%,var(--card))}
.oc-top b{flex:1;font-size:19px;line-height:1.2;font-weight:700;letter-spacing:-.3px}
.oc-bot{padding:12px 18px 14px}
.oc-bot .prog{height:7px;background:color-mix(in srgb,var(--pc) 12%,var(--bg3))}
.oc-meta{display:flex;justify-content:space-between;gap:8px;margin-top:9px;font-size:12.5px;color:var(--mute);flex-wrap:wrap}
.detail{min-width:0}
.detail.one{max-width:860px}
.detail .empty{padding:40px 10px}
.ppage .subtabs{margin:18px 0 16px}
.ppage .notes{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:22px 26px;min-height:320px}
.pprops{display:flex;flex-wrap:wrap;align-items:center;gap:4px 14px;margin:10px 0 4px;color:var(--mute);font-size:13px}
.pprops .p{display:inline-flex;align-items:center;gap:6px;padding:3px 8px;border-radius:7px}
.pprops button.p:hover{background:var(--hover);color:var(--ink)}

/* hoy */
.hoy2{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);height:calc(100dvh - 48px - var(--rb,0px))}
.hoyleft,.hoyright{overflow:auto;min-width:0}
.hoyleft{padding:22px 26px 60px 30px;border-right:1px solid var(--line)}
.hoyright{padding:22px 34px 60px;background:var(--bg2);display:flex;flex-direction:column;gap:20px}
.hoyright>*{flex:none}
.hoyleft .colhead{align-items:flex-start;margin-bottom:18px;gap:6px}
.hoyleft .colhead>div{flex:1}
.hoyleft .colhead h2{font-size:26px;letter-spacing:-.6px}
.colhead .sub{display:block;font-size:13px;color:var(--mute);margin-top:2px}
.xbubble{background:var(--card);border:1px solid color-mix(in srgb,var(--pc) 18%,var(--line));border-radius:28px;overflow:hidden}
.xhead{display:flex;justify-content:space-between;gap:12px;padding:16px 34px;background:color-mix(in srgb,var(--pc) 14%,var(--card));font-size:13px;color:var(--mute);font-weight:500}
.xbody{display:flex;flex-direction:column;align-items:center;text-align:center;padding:44px 48px 46px}
.xbody h2{font-size:27px;line-height:1.25;font-weight:700;letter-spacing:-.5px;max-width:30ch;overflow-wrap:anywhere}
.xbody .clocklabel{margin-top:30px;font-size:13px}
.xbody .clock{font-size:clamp(54px,5.4vw,84px);margin:4px 0 0;letter-spacing:-2.5px}
.xbody .est{margin-top:6px;font-size:13px}
.xbody .play-round{margin:34px auto 0;width:96px;height:96px}
.xbody .play-round svg{width:42px;height:42px;display:block}
.xbody .play-round:not(.is-running) svg{transform:none}
.xbody .finish-link{margin-top:20px}
.xbody .noteinput{margin-top:34px;max-width:420px;text-align:center}
.xbody .timer-done{margin-top:26px}
.retake{margin-top:20px;font-size:13px}
.xcard{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:28px 32px}
.xcard h3{font-size:13px;font-weight:600;color:var(--mute);margin:0 0 14px}
.bigstats{display:grid;grid-template-columns:repeat(3,1fr);gap:16px;margin-bottom:6px}
.bigstats small{display:block;color:var(--mute);font-size:12.5px}
.bigstats b{font-size:22px;font-weight:650;letter-spacing:-.4px}
.xcard .capbar{height:10px;margin:16px 0 12px}
.ritmo{font-size:14px;line-height:1.55;color:var(--ink)}
.ritmo .good{color:var(--g1)}.ritmo .warnc{color:#b57d12}.ritmo .badc{color:var(--red)}
:root[data-theme=dark] .ritmo .warnc{color:var(--amber)}
.mini{display:flex;flex-wrap:wrap;gap:8px 28px;margin-top:16px;padding-top:16px;border-top:1px solid var(--line);font-size:12.5px;color:var(--mute)}
.mini span{display:flex;flex-direction:column}
.mini b{font-size:16px;color:var(--ink);font-weight:600}
.mini small{font-size:11px;color:var(--faint)}
.oprog{padding:10px 0}
.op1{display:flex;justify-content:space-between;gap:10px;font-size:14px;font-weight:600}
.op1 .nm{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.optrack{height:10px;border-radius:5px;background:color-mix(in srgb,var(--pc) 14%,var(--bg3));margin:8px 0 6px;overflow:hidden}
.optrack i{display:block;height:100%;border-radius:5px;background:var(--pc)}
.op2{font-size:12.5px;color:var(--mute)}
.oprog.full .op1 b{color:var(--g1)}
.xcard .brk{padding:5px 0;font-size:13.5px}
.xcard .brk:after{content:none}

/* cronología: orgánica, sin separadores */
.tlbar{display:flex;align-items:center;gap:8px;margin:0 0 12px;flex-wrap:wrap}
.tlbar h2{font-size:22px;font-weight:700;letter-spacing:-.5px}
.tlbar .grow{flex:1}
.tlpage{max-width:none}
.tl{overflow:auto;border:1px solid var(--line);border-radius:20px;max-height:calc(100dvh - 190px);position:relative;background:var(--bg)}
.tlpage .tl{max-height:calc(100dvh - 210px)}
.tl-in{position:relative;width:calc(var(--left) + var(--w));padding-bottom:16px}
.tl-row{display:flex;border:0}
.tl-left{position:sticky;left:0;z-index:6;width:var(--left);flex:none;background:var(--bg);display:flex;align-items:center;gap:8px;padding:0 14px;font-size:13px;overflow:hidden;white-space:nowrap}
.tl-left .two{display:flex;flex-direction:column;min-width:0;line-height:1.25}
.tl-left .n{overflow:hidden;text-overflow:ellipsis;min-width:0;font-weight:600;font-size:13.5px}
.tl-left .pj{font-size:11.5px;color:var(--faint);overflow:hidden;text-overflow:ellipsis}
.tl-left .pctn{margin-left:auto;color:var(--faint);font-size:12px;flex:none}
.tl-left .warn{margin-left:auto;color:var(--red);font-size:11.5px;font-weight:600;flex:none}
.tl-left.sl{padding-left:46px}
.tl-left.sl .n{font-weight:500;font-size:13px}
.tcaret{width:20px;height:20px;display:grid;place-items:center;color:var(--mute);flex:none;transition:transform .12s}
.tcaret:hover{background:var(--hover)}
.tcaret.open{transform:rotate(90deg)}
.tcaret svg{width:11px;height:11px}
.tl-track{position:relative;width:var(--w);flex:none;cursor:crosshair;background-image:linear-gradient(to right,color-mix(in srgb,var(--line) 55%,transparent) 1px,transparent 1px);background-size:var(--px) 100%}
.tl-row.s .tl-track,.tl-row.mode .tl-track{cursor:default}
.tl-head{position:sticky;top:0;z-index:8;background:var(--bg);border-bottom:1px solid var(--line)}
.tl-head .tl-left{z-index:9}
.tl-row.hm{height:24px}.tl-row.hd{height:38px}.tl-row.ht{height:36px;border-top:1px solid var(--line)}
.tl-row.mode{height:34px;align-items:center}
.tl-row.mode .tl-left{height:100%}
.tl-row.mode .seg button{font-size:11.5px;padding:1px 9px}
.tl-scale{position:relative;width:var(--w);flex:none}
.tl-scale span{position:absolute;white-space:nowrap}
.tl-scale span.m{top:4px;font-size:12px;font-weight:650;color:var(--ink);padding-left:6px;border-left:1px solid var(--line2)}
.tl-scale span.d{top:3px;font-size:13px;font-weight:600;color:var(--ink);text-align:center;border-left:1px solid var(--line);bottom:0;padding-top:1px}
.tl-scale span.d small{display:block;font-size:10.5px;font-weight:500;color:var(--faint);text-transform:uppercase;letter-spacing:.04em;line-height:1.1}
.tl-scale span.d.we{color:var(--mute)}
.tl-scale span.d.is-today,.tl-scale span.d.is-today small{color:var(--accent)}
.tl-load span.tc{top:0;bottom:0;border-left:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px}
.tl-load span.tc b{font-size:12px;font-weight:600;color:var(--ink);font-variant-numeric:tabular-nums}
.tl-load span.tc i{display:block;height:4px;border-radius:2px;background:var(--g2);align-self:flex-start;margin-left:6px;max-width:calc(100% - 12px)}
.tl-load span.tc.over b{color:var(--red)}
.tl-load span.tc.over i{background:var(--red)}
.tl-load span.tm{bottom:0;background:var(--g2);opacity:.75;border-radius:2px 2px 0 0}
.tl-load span.tm.over{background:var(--red)}
.shade{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--ink) 3%,transparent);pointer-events:none;z-index:1}
.tcol{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--accent) 6%,transparent);pointer-events:none;z-index:1;border-left:1px solid color-mix(in srgb,var(--accent) 30%,transparent);border-right:1px solid color-mix(in srgb,var(--accent) 30%,transparent)}
.bar{position:absolute;top:10px;height:32px;border-radius:11px;background:color-mix(in srgb,var(--pc) 18%,var(--bg));border:0;color:var(--ink);font-size:13.5px;font-weight:600;overflow:hidden;white-space:nowrap;display:flex;align-items:center;cursor:grab;z-index:3;touch-action:none}
.bar.est{background:color-mix(in srgb,var(--pc) 11%,var(--bg))}
.bar .fill{position:absolute;left:0;top:0;bottom:0;width:var(--done);background:color-mix(in srgb,var(--pc) 22%,var(--bg));pointer-events:none}
.bar .lbl{position:relative;padding:0 14px;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.bar .bl,.bar .br{position:absolute;top:0;bottom:0;width:9px;cursor:ew-resize;z-index:2}
.bar .bl{left:0}.bar .br{right:0}
.bar:hover .bl,.bar:hover .br{background:color-mix(in srgb,var(--pc) 30%,transparent)}
.bar.preview{opacity:.7;pointer-events:none}
.bar.sb{top:6px;height:13px;border-radius:7px;background:color-mix(in srgb,var(--pc) 30%,var(--bg))}
.bar.sb.est{background:color-mix(in srgb,var(--pc) 20%,var(--bg))}
.bar.sb .bl,.bar.sb .br{width:8px}
.dn{position:absolute;text-align:center;font-size:11px;line-height:16px;color:var(--mute);font-variant-numeric:tabular-nums;pointer-events:none;z-index:2}
.dn.past{color:var(--ink);font-weight:600}
.dn.now{color:var(--ink);font-weight:700}
.tlnote{font-size:12px;color:var(--faint);margin-top:8px;max-width:115ch}

@media(max-width:1100px){.hoy2{display:block;height:auto}.hoyleft,.hoyright{overflow:visible}.split{grid-template-columns:1fr}.rail{position:static;max-height:none}}
@media(max-width:760px){.apills{padding:12px}.bubbles{grid-template-columns:minmax(0,1fr)}header.top{overflow:auto}.xbody{padding:30px 22px}}
.bhead>.lines{opacity:.4}

/* ===== v6 ===== */
.bhead{padding:18px 22px 16px;background:var(--card);display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr) auto;gap:8px 24px;align-items:start;border-bottom:1px solid var(--line)}
.bhead>.lines{left:6px;top:22px}
.bh-title{display:flex;align-items:center;gap:11px;min-width:0}
.bh-title .oname{font-size:17px;line-height:1.25;font-weight:650;letter-spacing:-.25px;padding:0 2px;min-width:40px;overflow-wrap:anywhere}
.gl{flex:none;width:38px;height:38px;border-radius:50%;display:inline-grid;place-items:center;background:color-mix(in srgb,var(--ac) 20%,var(--card));color:color-mix(in srgb,var(--ac) 80%,var(--ink));border:0;cursor:pointer;padding:0}
.gl:hover{background:color-mix(in srgb,var(--ac) 32%,var(--card))}
.gl.static{cursor:default}.gl.static:hover{background:color-mix(in srgb,var(--ac) 20%,var(--card))}
.gl .gi{width:19px;height:19px}
.gl.sm{width:30px;height:30px;cursor:inherit}.gl.sm .gi{width:15px;height:15px}
.btags{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:9px 0 0 49px}
.btags .tag,.atag{font-size:11.5px;padding:2px 9px;border-radius:999px;font-weight:550}
.atag{background:color-mix(in srgb,var(--ac) 18%,var(--card));color:color-mix(in srgb,var(--ac) 75%,var(--ink));white-space:nowrap}
.atag.sm{font-size:10.5px;padding:1px 7px}

.bh-r{min-width:0}

.bubble .bbody{background:var(--card);font-size:13px}
.bubble .tname,.bubble .task{font-size:13px}
.bubble .sec .sname{font-size:13px}
.glyphs{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:8px;width:290px}
.glyphs button{height:36px;border-radius:9px;display:grid;place-items:center;color:var(--ink)}
.glyphs button:hover{background:var(--bg3)}.glyphs .gi{width:19px;height:19px}
/* escalas generales más pequeñas */
.hoyleft .colhead h2,.wc-in .colhead h2{font-size:20px;letter-spacing:-.4px}
.xbody h2{font-size:20px}
.xbody .clock{font-size:clamp(44px,4.2vw,60px)}
.xbody .play-round{width:76px;height:76px;margin-top:26px}.xbody .play-round svg{width:32px;height:32px}
.xbody{padding:32px 36px 34px}
.xcard h3{font-size:13px}
.apill{padding:8px 14px;font-size:13.5px;border-radius:12px}
/* vista Trabajo */
.work{height:calc(100dvh - 48px - var(--rb,0px));display:flex;flex-direction:column;min-height:0}
.wtop{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:10px 20px;border-bottom:1px solid var(--line)}
.vsep{width:1px;height:20px;background:var(--line);margin:0 6px}
.hoytog,.fpill{font-size:12.5px;padding:5px 13px;border-radius:999px;color:var(--mute);background:transparent;border:1px solid var(--line);font-weight:550}
.fpill{--ac:var(--mute)}
.fpill:hover,.hoytog:hover{background:var(--bg3)}
.fpill[aria-pressed=true]{background:color-mix(in srgb,var(--ac) 20%,var(--card));border-color:color-mix(in srgb,var(--ac) 45%,var(--line));color:var(--ink)}
.hoytog[aria-pressed=true]{background:color-mix(in srgb,var(--g1) 18%,var(--card));border-color:color-mix(in srgb,var(--g1) 50%,var(--line));color:var(--g1)}
.wmain{flex:1;min-height:0;display:grid;grid-template-columns:290px minmax(0,1fr)}
.work.hoyon .wmain{grid-template-columns:290px minmax(0,1.05fr) minmax(0,.95fr)}
.wrail{overflow:auto;padding:10px 8px 40px;border-right:1px solid var(--line);display:flex;flex-direction:column;gap:2px}
.wcenter{overflow:auto;min-width:0}
.wc-in{padding:18px 22px 60px;max-width:980px}
.work.hoyon .wcenter{border-right:1px solid var(--line)}
.ritem{display:flex;gap:9px;align-items:flex-start;padding:9px 8px;border-radius:12px;cursor:pointer;position:relative}
.ritem:hover{background:var(--bg3)}
.ritem[aria-current=true]{background:color-mix(in srgb,var(--ac) 12%,var(--bg))}
.ritem.drop-before{box-shadow:0 -2px 0 var(--accent)}.ritem.drop-after{box-shadow:0 2px 0 var(--accent)}
.ritem .rt{min-width:0;flex:1}
.ritem .rt b{font-size:13px;font-weight:600;display:block;line-height:1.3;overflow-wrap:anywhere}
.ritem .rm{display:flex;gap:6px;align-items:center;margin-top:3px;flex-wrap:wrap}

.ritem .rb{display:flex;align-items:center;gap:7px;margin-top:5px}
.ritem .rb .prog{flex:1;height:4px;border-radius:3px;background:var(--bg3)}
.work .hoyright{padding:18px 26px 50px;height:auto}
.solidbtn{font-weight:600}
.tl-left .pj{font-size:11px}
@media(max-width:1100px){.work{height:auto}.wmain,.work.hoyon .wmain{display:block}.wrail{flex-direction:row;overflow:auto;border:0}.ritem{min-width:200px}.bhead{grid-template-columns:1fr}.btags{margin-left:0}}

.bubble{will-change:auto}

/* v8 */
.atag.pick{display:inline-flex;align-items:center;gap:3px;cursor:pointer}
.atag.pick:hover{background:color-mix(in srgb,var(--ac) 30%,var(--card))}
.atag.pick svg{width:12px;height:12px;opacity:.7}
.adot{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.rhead{display:flex;align-items:center;gap:7px;padding:16px 8px 5px;font-size:10.5px;letter-spacing:.09em;text-transform:uppercase;font-weight:650;color:var(--mute)}
.rhead:first-child{padding-top:6px}
.rhead i{width:7px;height:7px;border-radius:50%;background:var(--ac)}
.fpill,.hoytog{background:var(--card)}
.fpill.all[aria-pressed=true]{background:color-mix(in srgb,var(--red) 12%,var(--card));border-color:color-mix(in srgb,var(--red) 40%,var(--line));color:var(--red)}
.bubble .oprops{display:flex;flex-wrap:wrap;gap:2px 4px;padding:8px 10px 6px;font-size:12px}
#pop:has(.cal){padding:14px;border-radius:16px;background:var(--card);box-shadow:0 12px 40px rgba(0,0,0,.14),0 0 0 1px var(--line)}
.cal{width:252px}
.calh{display:flex;align-items:center;justify-content:space-between;margin-bottom:8px}
.calh b{font-size:13px;font-weight:600}
.cnav{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;color:var(--mute)}
.cnav:hover{background:var(--bg3);color:var(--ink)}.cnav svg{width:16px;height:16px}
.cdow,.cgrid{display:grid;grid-template-columns:repeat(7,1fr);gap:2px}
.cdow span{font-size:10.5px;color:var(--faint);text-align:center;padding:4px 0}
.cd{aspect-ratio:1;border-radius:50%;font-size:12.5px;color:var(--ink);font-variant-numeric:tabular-nums}
.cd:hover{background:var(--bg3)}.cd.td{font-weight:700;color:var(--accent)}
.cd.sel{background:var(--ink);color:var(--card)}
.cfoot{display:flex;justify-content:space-between;border-top:1px solid var(--line);margin-top:10px;padding-top:8px}
.cfoot button{font-size:12.5px;color:var(--mute);padding:4px 9px;border-radius:7px}
.cfoot button:hover{background:var(--bg3);color:var(--ink)}.cfoot .rm:hover{color:var(--red)}

/* v9 */
.secblock{position:relative;border-radius:14px;transition:background .1s}
.secblock.sec-target{background:color-mix(in srgb,var(--accent) 8%,transparent);outline:2px dashed color-mix(in srgb,var(--accent) 70%,transparent);outline-offset:-2px}
.secblock.sec-target:after{position:absolute;right:12px;font-size:11px;font-weight:600;color:var(--accent);background:var(--card);padding:1px 8px;border-radius:999px;pointer-events:none}
.secblock.sec-target[data-dir=after]:after{content:'Irá debajo de esta sección';bottom:8px}
.secblock.sec-target[data-dir=before]:after{content:'Irá encima de esta sección';top:8px}
/* planificación en burbujas */
.tl-group{position:relative;width:var(--w);margin-top:2px}
.gbub{position:absolute;top:4px;bottom:3px;border-radius:20px;z-index:2;pointer-events:none;background:color-mix(in srgb,var(--pc) 6%,var(--card));border:1.5px solid color-mix(in srgb,var(--pc) 32%,var(--line))}
.bar{background:color-mix(in srgb,var(--pc) 22%,var(--card));gap:2px}
.bar.est{background:color-mix(in srgb,var(--pc) 13%,var(--card))}
.bar.open{background:color-mix(in srgb,var(--pc) 28%,var(--card))}
.bar .tcaret,.nobar .tcaret{position:relative;z-index:3;margin-left:7px;pointer-events:auto;border-radius:6px}
.bar .lbl{padding:0 6px 0 4px;flex:1;min-width:0}
.bar .lbl b{font-weight:650;font-size:13px}
.bar .lbl small{font-size:11.5px;color:var(--mute);font-weight:450;margin-left:6px}
.bar .warn{color:var(--red);font-size:11.5px;font-weight:650;margin-right:8px;flex:none;position:relative}
.bar .pctn{font-size:11.5px;color:var(--mute);margin-right:12px;flex:none;position:relative}
.bar.sb{top:5px;height:22px;border-radius:9px;background:color-mix(in srgb,var(--pc) 30%,var(--card))}
.bar.sb.est{background:color-mix(in srgb,var(--pc) 17%,var(--card))}
.bar.sb .lbl{padding:0 12px;font-size:12px;font-weight:550}
.bar.sb .lbl small{margin-left:4px}
.nobar{position:absolute;top:14px;height:28px;display:flex;align-items:center;gap:2px;font-size:12.5px;color:var(--mute);z-index:3;white-space:nowrap}
.nobar b{color:var(--ink);font-weight:600}.nobar small{margin-left:6px;color:var(--faint)}
.tl-head .lt{position:sticky;left:0;width:0;z-index:9;overflow:visible;height:100%}
.tl-head .lt span{position:absolute;left:12px;top:50%;transform:translateY(-50%);white-space:nowrap;font-size:12.5px;background:var(--bg);padding:3px 10px;border-radius:999px;border:1px solid var(--line)}
.tl-head .lt small{color:var(--faint);font-size:11.5px}
.tl-row.s .tl-track{cursor:default}

/* v10 */
.pflag{display:inline-flex;align-items:center;gap:3px;margin-left:7px;color:var(--red);vertical-align:-2px;font-size:11px;font-weight:650}
.pflag svg{width:14px;height:14px}
.bh-title .pflag{background:color-mix(in srgb,var(--red) 12%,var(--card));padding:2px 8px 2px 6px;border-radius:999px;flex:none;vertical-align:baseline}
.bh-title .pflag svg{width:12px;height:12px}
.fpill,.hoytog{display:inline-flex;align-items:center;gap:7px}
.cnt{font-size:11px;font-weight:600;opacity:.75;font-variant-numeric:tabular-nums}
.fpill{background:color-mix(in srgb,var(--ac) 12%,var(--card));border-color:color-mix(in srgb,var(--ac) 28%,var(--line));color:var(--ink)}
.fpill:hover{background:color-mix(in srgb,var(--ac) 20%,var(--card))}
.fpill[aria-pressed=true]{background:color-mix(in srgb,var(--ac) 30%,var(--card));border-color:color-mix(in srgb,var(--ac) 65%,var(--line));font-weight:650}
.fpill.all,.fpill.all:hover{background:var(--card);border-color:var(--line);color:var(--ink)}
.fpill.all[aria-pressed=true]{background:var(--card);border:1.5px solid var(--ink);color:var(--ink);font-weight:650;padding:4.5px 12.5px}
/* tarjeta de objetivo en la planificación */
.bar.card{top:6px;height:56px;border-radius:16px;background:var(--card);border:1.5px solid color-mix(in srgb,var(--ac) 30%,var(--line));box-shadow:0 1px 2px rgba(0,0,0,.04);padding:0 12px 0 4px;gap:8px;overflow:hidden;cursor:grab}
.bar.card.pinned{border-color:color-mix(in srgb,var(--ac) 70%,var(--line))}
.bar.card .lbl{display:flex;flex-direction:column;gap:3px;padding:0;flex:1;min-width:0;line-height:1.2}
.bar.card .lbl b{font-size:13.5px;font-weight:650;overflow:hidden;text-overflow:ellipsis}
.bar.card .l2{display:flex;gap:6px;align-items:center;min-width:0;overflow:hidden}
.bar.card .l2 small{margin:0;font-size:11px;color:var(--mute);overflow:hidden;text-overflow:ellipsis}

.bar.card .tcaret{margin-left:6px}
.bar.card .ext{position:absolute;left:0;bottom:0;height:4px;width:var(--rw);background:color-mix(in srgb,var(--ac) 22%,var(--card));pointer-events:none}
.bar.card .ext i{display:block;height:100%;width:var(--done);background:var(--ac)}
.bar.card .br{left:calc(var(--rw) - 9px);right:auto}
.bar.card .pctn{margin-right:0}
.gbub{top:3px;bottom:2px;border-radius:22px;background:color-mix(in srgb,var(--pc) 5%,var(--card));border:1.5px solid color-mix(in srgb,var(--pc) 28%,var(--line))}
.bar.sb{top:5px;height:12px;border-radius:6px;background:color-mix(in srgb,var(--pc) 38%,var(--card))}
.bar.sb.est{background:color-mix(in srgb,var(--pc) 24%,var(--card))}
.slbl{position:absolute;top:2px;font-size:11.5px;line-height:18px;color:var(--ink);white-space:nowrap;pointer-events:none;z-index:3;font-weight:550}
.slbl small{color:var(--faint);font-weight:450}
.tl-row.s .tl-track{overflow:visible}

/* v11 */
.prio{width:14px;height:14px;border-radius:50%;border:1.5px solid color-mix(in srgb,var(--mute) 32%,transparent);background:transparent;margin-left:8px;flex:none;display:inline-block;vertical-align:-1px;padding:0;transition:background .12s,border-color .12s}
.prio:hover{border-color:var(--mute)}
.prio[aria-pressed=true]{background:var(--red);border-color:var(--red)}
.ritem .prio{width:11px;height:11px;margin-left:6px}
.hoytog[aria-pressed=true]{background:var(--ink);border-color:var(--ink);color:var(--card)}
.fpill{background:var(--card);border-color:var(--line)}
.fpill:hover{background:var(--bg3)}
.fpill[aria-pressed=true]{background:color-mix(in srgb,var(--ac) 26%,var(--card));border-color:color-mix(in srgb,var(--ac) 60%,var(--line))}
.fpill.all:hover{background:var(--bg3)}
.fpill.all[aria-pressed=true]{background:var(--card)}
header.top .tabs button{display:inline-flex;align-items:center;gap:7px}
.ti{display:inline-grid;opacity:.55}.ti .gi{width:15px;height:15px}
header.top .tabs button[aria-current=page] .ti{opacity:.9}
.olabel{position:absolute;top:4px;height:28px;display:flex;align-items:center;gap:8px;white-space:nowrap;z-index:5;cursor:pointer;padding-right:6px;font-size:12px;color:var(--mute)}
.olabel .tcaret{margin:0 -2px 0 0;pointer-events:none}
.olabel .ot{font-size:14px;font-weight:650;color:var(--ink);letter-spacing:-.15px}
.olabel small{font-size:11.5px;color:var(--mute)}
.olabel .oh{font-weight:650;color:var(--ink);font-size:12.5px}
.olabel .warn{color:var(--red);font-weight:650}
.olabel .pctn{color:var(--faint)}
.bar.main{top:36px;height:20px;border-radius:10px;background:color-mix(in srgb,var(--pc) 30%,var(--card))}
.bar.main.est{background:color-mix(in srgb,var(--pc) 18%,var(--card))}
.bar.main.pinned{background:color-mix(in srgb,var(--pc) 42%,var(--card))}
.bar.main .fill{background:color-mix(in srgb,var(--pc) 70%,var(--card));opacity:.8}
.slbl{top:0;line-height:18px;font-size:12px;font-weight:600}
.bar.sb{top:20px;height:10px;border-radius:5px}
.gbub{top:2px}

/* v12: burbuja de objetivo en la planificación */
.tl-group{margin-top:8px;padding-bottom:10px}
.gbub{top:0;bottom:0;border-radius:22px;background:var(--card);border:1.5px solid color-mix(in srgb,var(--pc) 34%,var(--line));box-shadow:0 1px 2px rgba(0,0,0,.04)}
.olabel{top:12px;height:auto;flex-direction:column;align-items:flex-start;gap:4px;overflow:hidden;min-width:0}
.ol1,.ol2{display:flex;align-items:center;gap:8px;min-width:0;max-width:100%}
.ol1 .ot{min-width:0;overflow:hidden;text-overflow:ellipsis;flex:0 1 auto}
.ol1 .gl{flex:none}.ol1 .prio{margin-left:2px}
.ol2{padding-left:2px;overflow:hidden}
.ol2 small{overflow:hidden;text-overflow:ellipsis;flex:0 1 auto;min-width:0}
.ol2 .atag,.ol2 .oh,.ol2 .pctn,.ol2 .warn,.ol2 .pinpill{flex:none}
.pinpill{display:inline-flex;align-items:center;gap:2px;font-size:11px;font-weight:600;color:var(--ink);background:var(--bg3);padding:1px 3px 1px 8px;border-radius:999px}
.rst{width:18px;height:18px;border-radius:50%;font-size:12px;line-height:1;color:var(--mute);display:grid;place-items:center}
.rst:hover{background:var(--card);color:var(--ink)}
.bar.main{top:64px;height:14px;border-radius:7px;overflow:visible}
.bar.main .fill{border-radius:7px 0 0 7px}
.bar.main .bl,.bar.main .br{width:14px;top:-52px;height:calc(100% + 66px);border-radius:8px;background:transparent;z-index:4}
.bar.main .bl{left:-9px}.bar.main .br{right:-9px}
.bar.main:hover .bl,.bar.main:hover .br{background:color-mix(in srgb,var(--pc) 30%,transparent)}
.bar.sb{top:21px}
.slbl{top:1px}

.olabel{pointer-events:none}.olabel>div{pointer-events:none}
.olabel .ol1>*,.olabel .ol2>*{pointer-events:auto}
.viewall.top{margin:6px auto 4px}

/* v13: tarjeta de objetivo = la de la lista, dentro de una burbuja del color del área */
.olabel{display:none}
.tl-group{margin-top:10px;padding-bottom:12px}
.gbub{top:0;bottom:0;border:0;border-radius:24px;background:color-mix(in srgb,var(--pc) 11%,var(--card));box-shadow:none}
.tlcard{position:absolute;top:14px;width:258px;display:flex;gap:12px;align-items:flex-start;padding:2px 24px 2px 4px;cursor:grab;z-index:5;color:var(--ink)}
.tlcard .gl{width:38px;height:38px;margin-top:2px}
.tlcard .rt{flex:1;min-width:0}
.tlcard .rt b{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;font-size:14px;line-height:1.3;font-weight:650;letter-spacing:-.15px}
.tlcard .rm{display:flex;gap:7px;align-items:center;margin-top:5px;min-width:0}
.tlcard .rm small{color:var(--mute);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tlcard .rb{display:flex;align-items:center;gap:8px;margin-top:8px}
.tlcard .rb .prog{flex:1;height:5px;border-radius:3px;background:color-mix(in srgb,var(--pc) 14%,var(--bg3))}
.tlcard .rb small{font-size:11.5px;color:var(--mute);white-space:nowrap}
.tlcard .rb .warn{font-size:11px;color:var(--red);font-weight:650;white-space:nowrap}
.tlcard .cv{position:absolute;right:4px;top:6px;width:18px;height:18px;display:grid;place-items:center;color:var(--mute);transition:transform .12s}
.tlcard .cv.open{transform:rotate(90deg)}.tlcard .cv svg{width:11px;height:11px}
.tlcard .prio{vertical-align:-1px}
.tlcard .rst{display:inline-grid;vertical-align:-2px;margin-left:5px;width:18px;height:18px;border-radius:50%;background:color-mix(in srgb,var(--pc) 18%,var(--card));color:var(--ink);font-size:12px;font-weight:600}
.tlcard .rst:hover{background:color-mix(in srgb,var(--pc) 34%,var(--card))}
.bar.main{top:112px;height:12px;border-radius:6px}
.bar.main .bl,.bar.main .br{top:-5px;height:calc(100% + 10px)}
.bar.main .fill{border-radius:6px 0 0 6px}
/* subsecciones sutiles */
.slbl{font-size:11px;font-weight:500;color:var(--mute);line-height:16px;top:0}
.slbl small{color:var(--faint);font-size:10.5px}
.bar.sb{top:18px;height:7px;border-radius:4px;background:color-mix(in srgb,var(--pc) 34%,var(--card))}
.bar.sb.est{background:color-mix(in srgb,var(--pc) 22%,var(--card))}
.bar.sb .bl,.bar.sb .br{width:8px}
.tl-group.drop-before:before,.tl-group.drop-after:after{left:0;right:auto;width:var(--w);height:3px}

/* v14 */
.tl-row.hc{height:30px;border-top:1px solid var(--line)}
.cp{position:absolute;top:3px;bottom:3px;display:grid;place-items:center}
.capin{width:calc(100% - 14px);max-width:54px;text-align:center;border:1px solid transparent;background:transparent;border-radius:8px;font-size:12px;color:var(--mute);padding:2px 0;font-variant-numeric:tabular-nums}

.capin:focus{outline:none;border-color:var(--ink);background:var(--card);color:var(--ink)}

.bar.sb{pointer-events:none}
.bar.sb.sum{background:color-mix(in srgb,var(--pc) 30%,var(--card));height:9px;top:8px}
.tl-row.s.nolbl .bar.sb{top:6px}
.seg{position:static}
i.seg{position:absolute;top:18px;height:7px;border-radius:4px;background:color-mix(in srgb,var(--pc) 58%,var(--card));display:block}
.tl-row.s.nolbl i.seg{top:6px}
.tl-track .slbl{pointer-events:none}
.tl-row.o .tlcard{top:16px}
#tlguide{position:absolute;top:0;bottom:0;background:color-mix(in srgb,var(--accent) 9%,transparent);border-left:2px solid var(--accent);border-right:2px solid var(--accent);pointer-events:none;z-index:7}
#tlguide:before{content:attr(data-label);position:sticky;top:150px;display:inline-block;margin:6px 6px 0;font-size:11.5px;font-weight:600;color:var(--accent);background:var(--card);padding:2px 9px;border-radius:999px;white-space:nowrap}
.dropping .tcol{opacity:.4}
.ritem.daily .gl{background:var(--bg3);color:var(--mute)}
.ritem.daily[aria-current=true]{background:var(--bg3)}

.fpill.daily[aria-pressed=true]{background:var(--bg3);border-color:var(--mute)}

/* v15 */
.tlcard{width:470px;top:9px}
.tl-row.o .tlcard{top:9px}
.tlcard .gl{width:34px;height:34px;margin-top:1px}
.tlcard .rm{margin-top:3px}
.tlcard .rt b{-webkit-line-clamp:1}
.tl-row.s.tot .bar.sb{top:6px}
.tl-row.s.nolbl i.seg{top:6px}
/* Día a día en lavanda */
.ritem.daily .gl{background:color-mix(in srgb,var(--ac) 22%,var(--card));color:color-mix(in srgb,var(--ac) 85%,var(--ink))}
.ritem.daily[aria-current=true]{background:color-mix(in srgb,var(--ac) 11%,var(--card))}
.fpill.daily[aria-pressed=true]{background:color-mix(in srgb,var(--ac) 16%,var(--card));border-color:var(--ac);color:var(--ink)}
/* Hoy en verde, siempre visible */
.today{opacity:.55;color:var(--faint)}
.task:hover .today,.task.picked .today{opacity:1}
.today.on{opacity:1;background:var(--play);color:#fff;font-weight:600;padding:1px 9px;border-radius:999px}
.today.on:hover{background:var(--play-hi);color:#fff}
.tplay:not(.on){background:color-mix(in srgb,var(--mute) 7%,transparent)}

.fpill:not(.all):not([aria-pressed=true]):hover{background:color-mix(in srgb,var(--ac) 22%,var(--card));border-color:color-mix(in srgb,var(--ac) 60%,var(--line));color:var(--ink)}

/* v16 */
.today.on{background:color-mix(in srgb,var(--g1) 14%,transparent);color:var(--g1);font-weight:500;padding:1px 6px;border-radius:4px}
.today.on:hover{background:color-mix(in srgb,var(--g1) 24%,transparent);color:var(--g1)}
.hoytog[aria-pressed=true]{background:var(--play);border-color:var(--play);color:#fff}
.hoytog:not([aria-pressed=true]):hover{background:color-mix(in srgb,var(--play) 14%,var(--card));border-color:color-mix(in srgb,var(--play) 50%,var(--line))}
.chipi.red{background:color-mix(in srgb,var(--red) 11%,var(--card));color:var(--red);font-weight:600}
.bi{width:14px;height:14px;flex:none}
.btn.ic,.seg button:has(.bi){display:inline-flex;align-items:center;gap:6px}

/* v17 */
.bh-r{display:flex;flex-direction:column}
.bh-r .bprog{height:38px;margin:0;align-items:center}
.bh-r .chips2{margin:9px 0 0;min-height:22px;align-items:center}
.chipi.red{background:color-mix(in srgb,var(--pc) 10%,var(--card));color:var(--ink);font-weight:400}
.hoytog[aria-pressed=true] .cnt{color:#fff;opacity:.9}
.cnt{background:none!important;padding:0!important;border:0!important}

/* v18 */
.capin{max-width:72px;font-size:11.5px;white-space:nowrap}
.bubble .bbody{background:color-mix(in srgb,var(--pc) 5%,var(--card))}

/* v19: Día a día con secciones · Proyectos · editor */
.pjview{display:grid;grid-template-columns:260px minmax(0,1fr);min-height:calc(100vh - 56px)}
.prail{border-right:1px solid var(--line);padding:16px 10px 40px;position:sticky;top:56px;align-self:start;max-height:calc(100vh - 56px);overflow:auto}
.prail .rhead{display:flex;align-items:center;justify-content:space-between;margin:16px 8px 6px;font-size:10.5px;letter-spacing:.9px;text-transform:uppercase;color:var(--faint);font-weight:650}
.prail .rhead:first-child{margin-top:4px}
.addmini{border:0;background:none;color:var(--faint);font-size:15px;cursor:pointer;border-radius:6px;padding:0 6px}
.addmini:hover{background:var(--bg3);color:var(--ink)}
.pitem{display:flex;align-items:center;gap:9px;width:100%;text-align:left;border:0;background:none;padding:7px 10px;border-radius:9px;font-size:13.5px;color:var(--ink);cursor:pointer}
.pitem:hover{background:var(--bg3)}
.pitem.sel{background:color-mix(in srgb,var(--ac) 13%,var(--card));font-weight:600}
.pitem .pdot{width:9px;height:9px;border-radius:50%;background:var(--ac);flex:none}
.pitem .pn{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pitem small{color:var(--faint);font-size:11.5px;font-variant-numeric:tabular-nums}
.pempty{font-size:12.5px;color:var(--faint);margin:2px 12px}
.pjmain{min-width:0;padding:0 40px 120px}
.pjpage{max-width:1080px;margin:0 auto}
.pj-head{padding:34px 0 8px}
.pj-head .ptitle{display:block;font-size:30px;font-weight:700;letter-spacing:-.6px;outline:none}
.pj-head .pdesc{display:block;margin-top:4px;color:var(--mute);font-size:15px;outline:none}
.pj-props{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin-top:16px}
.pj-notion{display:flex;gap:8px;align-items:center;margin-top:14px;flex-wrap:wrap}
.nlogo{width:26px;height:26px;border-radius:7px;border:1.5px solid var(--ink);display:grid;place-items:center;font-weight:800;font-size:14px;flex:none}
.notion-in{flex:1;min-width:220px;max-width:460px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:7px 12px;font-size:13px;color:var(--ink)}
.notion-in:focus{outline:none;border-color:var(--ink)}
.pj-prev{margin-top:12px}
.pj-prev iframe{width:100%;height:480px;border:1px solid var(--line);border-radius:14px;background:var(--card)}
.pj-prev p{font-size:12px;color:var(--faint);margin:6px 2px}
.pj-nav{position:sticky;top:56px;z-index:5;display:flex;gap:4px;padding:10px 0;margin:10px 0 0;background:var(--bg);border-bottom:1px solid var(--line)}
.pj-nav button{border:0;background:none;padding:6px 12px;border-radius:999px;font-size:13px;color:var(--mute);cursor:pointer}
.pj-nav button:hover{background:var(--bg3);color:var(--ink)}
.pj-sec{padding-top:30px;scroll-margin-top:110px}
.pj-sec>h2{font-size:12px;letter-spacing:1px;text-transform:uppercase;color:var(--faint);font-weight:650;margin:0 0 14px}
.pj-stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.pst{border:1px solid var(--line);border-radius:14px;padding:14px 16px;background:var(--card)}
.pst small{display:block;color:var(--mute);font-size:12px}
.pst b{display:block;font-size:22px;margin-top:4px;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.pst em{display:block;font-style:normal;color:var(--faint);font-size:12px;margin-top:3px}
.pj-card{border:1px solid var(--line);border-radius:14px;padding:16px 18px;background:var(--card);margin-top:12px}
.pj-card h3{font-size:13px;margin:0 0 12px;color:var(--mute);font-weight:600}
.pjchart{display:flex;align-items:flex-end;gap:4px;height:110px}
.pjchart i{flex:1;background:color-mix(in srgb,var(--pc) 45%,var(--card));border-radius:4px 4px 2px 2px;min-width:3px}
.pjchart i.now{background:var(--pc)}
.pjaxis{display:flex;justify-content:space-between;font-size:11.5px;color:var(--faint);margin-top:6px}
.pj-kids{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.pj-kid{text-align:left;border:1px solid var(--line);background:color-mix(in srgb,var(--ac) 6%,var(--card));border-radius:12px;padding:12px 14px;cursor:pointer;border-left:3px solid var(--ac)}
.pj-kid b{display:block;font-size:14px}.pj-kid small{color:var(--mute);font-size:12px}
.pj-obj{position:relative;margin-bottom:16px}
.pj-obj .foldbtn{position:absolute;right:56px;top:18px;z-index:2;border:0;background:none;color:var(--faint);cursor:pointer;width:28px;height:28px;border-radius:8px;display:grid;place-items:center}
.pj-obj .foldbtn:hover{background:var(--bg3);color:var(--ink)}
.pj-obj .foldbtn svg{width:15px;height:15px;transition:transform .2s}
.pj-obj.closed .foldbtn svg{transform:rotate(-90deg)}
.pj-obj.closed .bbody{display:none}
.pj-log .logrow{display:grid;grid-template-columns:150px 1fr auto;gap:12px;padding:8px 2px;border-bottom:1px solid var(--line);font-size:13.5px}
.pj-log .t{color:var(--mute)}
/* editor */
.rte{min-height:220px;padding:18px 22px;border:1px solid var(--line);border-radius:16px;background:var(--card);font-size:15px;line-height:1.7;outline:none;position:relative;overflow-wrap:anywhere}
.rte:focus{border-color:color-mix(in srgb,var(--ink) 35%,var(--line))}
.rte[data-empty="1"]:before{content:attr(data-ph);position:absolute;color:var(--faint);pointer-events:none}
.rte h1{font-size:29px;line-height:1.25;margin:1.1em 0 .35em;letter-spacing:-.5px}
.rte h2{font-size:22px;line-height:1.3;margin:1em 0 .3em;letter-spacing:-.3px}
.rte h3{font-size:17.5px;margin:.9em 0 .25em}
.rte p{margin:.35em 0}
.rte ul,.rte ol{margin:.35em 0;padding-left:1.5em}
.rte blockquote{margin:.6em 0;padding:.1em 0 .1em 16px;border-left:3px solid var(--ink);font-size:16px}
.rte code{background:var(--bg3);padding:1px 6px;border-radius:5px;font-size:.88em;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
.rte pre{background:var(--bg3);padding:14px 16px;border-radius:10px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;white-space:pre-wrap;margin:.6em 0}
.rte mark{background:color-mix(in srgb,#f5c542 38%,transparent);border-radius:4px;padding:0 2px;color:inherit}
.rte a{color:var(--ink);text-decoration:underline;text-decoration-color:var(--faint);text-underline-offset:3px}
.rte hr{border:0;border-top:1px solid var(--line);margin:1.2em 0}
.rte .callout{background:color-mix(in srgb,var(--pc) 9%,var(--card));border-radius:12px;padding:10px 16px;margin:.7em 0;border:1px solid color-mix(in srgb,var(--pc) 18%,var(--line))}
.rte ul.todo{list-style:none;padding-left:0}
.rte ul.todo>li{position:relative;padding-left:28px;min-height:1.7em}
.rte ul.todo>li:before{content:'';position:absolute;left:2px;top:.42em;width:15px;height:15px;border:1.5px solid var(--faint);border-radius:4px;cursor:pointer}
.rte ul.todo>li[data-done="1"]:before{background:var(--play);border-color:var(--play);box-shadow:inset 0 0 0 2px var(--card)}
.rte ul.todo>li[data-done="1"]{color:var(--faint);text-decoration:line-through}
.rte .embed{position:relative;margin:.8em 0;border-radius:12px;overflow:hidden;background:var(--bg3);padding-top:56.25%}
.rte .embed iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
.rte .embed.img{padding-top:0}
.rte .embed.img img{display:block;max-width:100%;margin:0 auto}
.rte .embed-ask input{width:100%;border:1px dashed var(--line2);border-radius:10px;padding:10px 14px;font-size:14px;background:var(--bg3);color:var(--ink)}
#slashmenu{position:fixed;z-index:200;width:280px;max-height:300px;overflow:auto;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 40px rgba(0,0,0,.14);padding:6px}
#slashmenu button{display:flex;flex-direction:column;align-items:flex-start;width:100%;border:0;background:none;text-align:left;padding:7px 10px;border-radius:9px;cursor:pointer;color:var(--ink)}
#slashmenu button.on,#slashmenu button:hover{background:var(--bg3)}
#slashmenu b{font-size:13.5px;font-weight:600}#slashmenu small{color:var(--faint);font-size:12px}
#fbar{position:fixed;z-index:200;display:flex;align-items:center;gap:2px;background:var(--ink);color:var(--card);border-radius:10px;padding:4px;box-shadow:0 8px 28px rgba(0,0,0,.22)}
#fbar button{border:0;background:none;color:inherit;padding:5px 9px;border-radius:7px;font-size:12.5px;cursor:pointer}
#fbar button:hover{background:rgba(255,255,255,.16)}
#fbar .sep{width:1px;height:16px;background:rgba(255,255,255,.25);margin:0 3px}
#fbar input.lnk{width:260px;border:0;background:rgba(255,255,255,.14);color:inherit;border-radius:7px;padding:6px 10px;font-size:13px;outline:none}
@media(max-width:900px){.pjview{grid-template-columns:1fr}.prail{position:static;max-height:none;border:0}.pjmain{padding:0 18px 80px}.pj-stats{grid-template-columns:repeat(2,minmax(0,1fr))}}

/* v20: fecha de la tarea */
.task .today{justify-self:center;margin-left:12px;white-space:nowrap;font-size:12px}
.today.on,.today.tom,.today.wk,.today.far,.today.past{opacity:1}
.today.tom{background:color-mix(in srgb,var(--pause) 24%,transparent);color:color-mix(in srgb,var(--pause) 45%,var(--ink));font-weight:600;padding:1px 8px;border-radius:4px}
.today.tom:hover{background:color-mix(in srgb,var(--pause) 34%,transparent)}

/* v22 */
.pj-props .p{display:inline-flex;align-items:center;gap:8px;padding:6px 13px;border:1px solid var(--line);border-radius:999px;background:var(--card);font-size:13px;color:var(--ink);cursor:pointer;line-height:1.2}

.pj-head .ptitle,.pj-head .pdesc{padding:0}

/* v23: estados */
button.gl.sti:hover{filter:brightness(.96)}

.stfilter{display:inline-flex;gap:4px;margin-left:auto}

.sdot{width:8px;height:8px;border-radius:50%;display:inline-block;background:var(--faint)}

.oprops .bi{width:13px;height:13px;opacity:.65;margin-right:2px;flex:none}

.wtop .grow{flex:1}

.pj-crumb{font-size:12px;color:var(--faint);letter-spacing:.2px;margin-bottom:6px}.pj-crumb i{font-style:normal;margin:0 3px}

.plan2{display:grid;grid-template-columns:290px minmax(0,1fr);gap:0;height:calc(100dvh - 48px - var(--rb,0px))}

/* v28 */
.ritem{background:color-mix(in srgb,var(--ac) 9%,var(--bg))}
.ritem:hover{background:color-mix(in srgb,var(--ac) 14%,var(--bg))}
.ritem[aria-current=true]{background:color-mix(in srgb,var(--ac) 18%,var(--bg))}
.ritem.daily{background:color-mix(in srgb,var(--ac) 9%,var(--bg))}

.wrail,.pzone{gap:6px}
.p.static{cursor:default}

/* v30 nube */
.cloud{display:inline-flex;align-items:center;gap:6px;border:0;background:none;color:var(--mute);font-size:12px;padding:4px 8px;border-radius:999px;cursor:pointer}

#login{position:fixed;inset:0;z-index:200;background:var(--bg);display:flex;align-items:center;justify-content:center;padding:20px}
.lcard{width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px}

.lcard .btn.solid{padding:11px;justify-content:center}

@media(max-width:700px){.cloud span{display:none}}
.lcard .btn.solid{background:var(--ink);color:var(--bg);border-color:var(--ink);font-weight:600}

/* v33 filtros y ventana flotante */
.fpill.nf{background:var(--card);border-color:var(--line);color:var(--mute);gap:6px}
.fpill.nf:hover{background:var(--bg3);border-color:var(--line)}
.fpill.nf[aria-pressed=true]{background:var(--card);border:1.5px solid var(--ink);color:var(--ink);font-weight:650;padding:4.5px 12.5px}
.fpill.nf svg,.hoytog svg{width:15px;height:15px;flex:none}
.fl{height:100vh;display:flex;align-items:center;gap:10px;padding:0 12px;background:var(--card);color:var(--ink)}
.fl-t{flex:1;min-width:0;display:flex;flex-direction:column;gap:1px}

.fl-b{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;flex:none;border:0;cursor:pointer;color:#fff;background:var(--play)}

.fl-b.ok{background:var(--bg3);color:var(--mute)}

.btags .oprops.inl{display:inline-flex;flex-wrap:wrap;gap:2px 4px;padding:0;margin:0}

.btags .oprops.inl{flex-wrap:nowrap;gap:2px}

/* v36 */
.dchip{font-size:11px;font-weight:600;padding:1px 8px;border-radius:999px;background:var(--bg3);color:var(--mute);line-height:1.5}
.dchip.dl-hoy{background:var(--play);color:#fff}
.dchip.dl-man{background:#f2c94c;color:#1b1b1b}

.xtask .xclock,.hoyright .xtask .xclock{margin-right:0}
.bigstats.two{grid-template-columns:1fr 1fr}
.tworked{text-align:right}

/* v118 feed de Hoy */
.feedc .feed{padding:6px 4px 40px}
.feed .fhead{position:relative;display:flex;align-items:center;gap:8px;margin:22px 0 4px;padding-left:28px;min-height:26px}
.feed .fhead:first-child{margin-top:8px}
.feed .fhead .sname{font-size:14.5px;font-weight:650;color:var(--ink);display:inline-flex;align-items:center;gap:6px}
.feed .fhead .sname svg{width:13px;height:13px;opacity:.55}
.feed .fhead .fctx{font-size:12.5px;color:var(--mute)}
.feed .fplus{margin-left:auto;border:0;background:none;color:var(--faint);font-size:18px;line-height:1;width:26px;height:26px;border-radius:7px;cursor:pointer;opacity:0}
.feed .fhead:hover .fplus,.feed .fplus:focus-visible{opacity:1}
.feed .fplus:hover{background:var(--hover);color:var(--ink)}
.feed .task{font-size:13px}
.feed .tname,.feed .task{font-size:13px}
.feed .task .tname:not(:focus){white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.feed .task .tmain{margin-left:4px}
.feed .fend{min-height:48px;border-radius:8px}
.feed .fend.drop-in{box-shadow:inset 0 0 0 2px var(--accent)}
.feed .fhead.drop-before:before{top:-8px}

/* v119 feed: alineación, barras, orden etiqueta/proyecto, tarea en marcha en verde */
.feed .fhead{padding-left:26px}
.feed .fhead .lines{position:absolute;left:4px;top:50%;margin:-7px 0 0;opacity:0}
.feed .fhead:hover .lines{opacity:.85}
.feed .fhead .sname{padding:0}
.feed .fhead .fctx{margin-left:2px}
.feed .insm .ez.t:before{left:26px}
.feed .insm .ez.t:after{left:4px}
.task.running{background:var(--play);color:#fff}
.task.running:hover{background:var(--play-hi)}
.task.running .tname,.task.running .tworked,.task.running .tworked:before,.task.running .tworked:after,.task.running .grip{color:#fff}
.task.running .tworked.zero{opacity:1}
.task.running .tworked:hover,.task.running .tworked:focus{background:rgba(255,255,255,.2);color:#fff}
.task.running .check{border-color:#fff;background:transparent}
.task.running .today,.task.running .today.on{background:rgba(255,255,255,.22)!important;color:#fff!important;opacity:1}
.task.running .tplay.on{background:#fff;color:var(--play)}
.task.running .tplay.on:hover{background:rgba(255,255,255,.9);color:var(--play)}
.task.running .rcic{color:#fff;opacity:.8}

/* v120 menú de tres puntos del proyecto */
.bhead>.iconbtn.objmore,.iconbtn.objmore{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line);background:transparent;display:grid;place-items:center;color:var(--mute);padding:0}
.iconbtn.objmore:hover{background:var(--hover);color:var(--ink)}

/* v122 tarea importante */
.tmain.fx{display:flex;align-items:center;gap:6px;min-width:0}
.tmain.fx .tname{flex:0 1 auto;min-width:0}
.impb{flex:none;width:20px;height:20px;padding:0;border:0;background:none;border-radius:50%;color:var(--faint);opacity:.35;cursor:pointer;display:grid;place-items:center;transition:opacity .1s,color .1s}
.impb svg{width:17px;height:17px}
.task:hover .impb,.task.picked .impb{opacity:.8}
.impb:hover{opacity:1;color:var(--red)}
.impb.on{opacity:1;color:var(--red)}
.task.isimp:not(.running){background:var(--red);color:#fff}
.task.isimp:not(.running):hover{filter:brightness(1.07)}
.task.isimp:not(.running) .tname,.task.isimp:not(.running) .tworked,.task.isimp:not(.running) .tworked:before,.task.isimp:not(.running) .tworked:after,.task.isimp:not(.running) .grip,.task.isimp:not(.running) .rcic{color:#fff}
.task.isimp:not(.running) .tworked.zero{opacity:1}
.task.isimp:not(.running) .check{border-color:#fff;background:transparent}
.task.isimp:not(.running) .today,.task.isimp:not(.running) .today.on{background:rgba(255,255,255,.22)!important;color:#fff!important;opacity:1}
.task.isimp:not(.running) .impb.on{color:#fff}
.task.isimp:not(.running) .tplay:not(.on){background:rgba(255,255,255,.22);color:#fff}
.task.isimp:not(.running) .tplay:not(.on):hover{background:#fff;color:var(--red)}
.task.isimp:not(.running) .tworked:hover,.task.isimp:not(.running) .tworked:focus{background:rgba(255,255,255,.2);color:#fff}
.task.running .impb.on{color:#fff}

.focusc .csec{font-size:11.5px;font-weight:650;letter-spacing:.6px;text-transform:uppercase;color:var(--mute);margin:26px 2px 10px;display:flex;align-items:center;gap:8px}

/* v127 grupos del feed de Hoy con contorno de color */

/* v129 ficha de área principal: título · área · N · puntos; formulario de Notion en columna */

.nform .crow{padding:0;margin-top:0;justify-content:flex-end}

.task.isimp:not(.running) .tmin:hover,.task.isimp:not(.running) .tmin:focus{background:rgba(255,255,255,.2);color:#fff}

.fgwrap{position:relative}

.fgwrap.drop-after:after{bottom:-12px;height:3px}

/* v137 */

/* v138 estimaciones */
.chipi.rest{background:var(--bg3);color:var(--mute);font-weight:400}
.sec .smeta{font-weight:400;font-size:11.5px;color:var(--faint)}
.bigstats.two{grid-template-columns:repeat(3,1fr)}
.xcard .bigstats b{white-space:nowrap}

/* v139 grupos de Focus: contraer + puntos visibles */
.fgh .lines{opacity:.5}
.fgtog{border:0;background:none;color:var(--faint);width:22px;height:22px;padding:0;margin:0 2px 0 0;border-radius:6px;display:inline-grid;place-items:center;cursor:pointer;vertical-align:middle;transition:transform .15s}
.fgtog svg{width:20px;height:20px}
.fgtog:hover{background:var(--bg3);color:var(--ink)}
.fgwrap.col .fgtog{transform:rotate(-90deg)}
.fgwrap.col>.bubbles{display:none}
.fgwrap.col{margin-bottom:-6px}
/* v140 notas de tarea */
.noteb{flex:none;width:20px;height:20px;padding:0;border:0;background:none;border-radius:50%;color:var(--faint);opacity:.35;cursor:pointer;display:grid;place-items:center;transition:opacity .1s,color .1s}
.noteb svg{width:16px;height:16px}
.task:hover .noteb,.task.picked .noteb{opacity:.8}
.noteb:hover{opacity:1;color:var(--ink)}
.noteb.has{opacity:1;color:var(--mute)}
.task.isimp:not(.running) .noteb,.task.running .noteb{color:#fff}
#tnote{position:fixed;inset:0;z-index:150;background:rgba(15,15,15,.45);display:flex;align-items:center;justify-content:center;padding:18px}
#tnote .tncard{background:var(--card);color:var(--ink);border:1px solid var(--line2);border-radius:18px;box-shadow:0 20px 60px rgba(0,0,0,.25);width:100%;max-width:640px;max-height:88vh;display:flex;flex-direction:column;overflow:hidden}
#tnote .tnhead{display:flex;align-items:flex-start;gap:10px;padding:18px 20px 10px}
#tnote .tnhead h3{margin:0;font-size:16px;line-height:1.4;flex:1;font-weight:600}
#tnote .tnhead small{display:block;color:var(--mute);font-weight:400;font-size:12px;margin-top:2px}
#tnote textarea{flex:1;min-height:300px;margin:0 20px;padding:14px 16px;border:1px solid var(--line);border-radius:12px;background:var(--bg2);color:var(--ink);font:inherit;font-size:14.5px;line-height:1.65;resize:vertical;outline:none}
#tnote textarea:focus{border-color:var(--line2)}
#tnote .tnfoot{display:flex;gap:8px;justify-content:flex-end;align-items:center;padding:12px 20px 18px}
#tnote .tnfoot .tnmsg{flex:1;color:var(--mute);font-size:12px}
#tnote .tnx{border:0;background:none;color:var(--mute);font-size:20px;line-height:1;cursor:pointer;padding:2px 6px;border-radius:8px}
#tnote .tnx:hover{background:var(--bg3);color:var(--ink)}

/* v140 tareas importantes arriba */
.keyblock{display:grid;gap:12px;margin:0 0 22px}
.kt{display:grid;gap:4px}
.ktctx{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:0 6px;font-size:11.5px;color:var(--mute);min-height:18px}
.ktsec{font-weight:600;letter-spacing:.04em;text-transform:uppercase;font-size:10.5px;color:var(--faint)}
.ktobj{color:var(--mute)}
.kt .atag{cursor:default}
.kt .task{padding-left:14px;padding-right:14px;border-radius:12px}

/* v141 reflexión del día */
.daynote{margin:0 0 20px}

.daynote .rte[data-empty="1"]:before{top:14px;left:18px}
/* v143 enlaces en tareas y notas */
.tlink{flex:none;width:20px;height:20px;display:grid;place-items:center;border-radius:50%;color:#2f6fdb;opacity:.9;text-decoration:none}
.tlink svg{width:15px;height:15px}
.tlink:hover{background:var(--bg3);opacity:1}
.task.isimp:not(.running) .tlink,.task.running .tlink{color:#fff}
.tnlinks{margin:10px 20px 0;display:flex;flex-wrap:wrap;gap:6px}
.tnlinks[hidden]{display:none}
.tnlinks a{display:inline-flex;align-items:center;gap:6px;max-width:100%;padding:5px 11px;border-radius:999px;background:var(--bg3);color:#2f6fdb;font-size:12.5px;text-decoration:none}
.tnlinks a svg{width:13px;height:13px;flex:none}
.tnlinks a span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tnlinks a:hover{text-decoration:underline}
/* v144 móvil: feed + barra inferior */
.tshort{display:none}

  body{touch-action:pan-y;padding-bottom:calc(62px + env(safe-area-inset-bottom,0px))}
  main,.work,.wmain,.wcenter,.wc-in{max-width:100vw;min-width:0}
  textarea,input,select,.rte{font-size:16px!important}
  /* barra superior compacta */
  header.top{padding:0 12px;gap:8px;overflow:visible;height:46px}
  header.top .brand{font-size:15px}

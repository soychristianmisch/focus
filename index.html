function seed(){
  const d={version:1,areas:[...MAIN_AREAS],projects:[],objectives:[],tasks:[],entries:[],plans:[],notes:[],inbox:[],order:{},running:null,paused:[],hours:Array(7).fill(10),areaColors:{}};
  if(true)return d;
  const today=day();
  for(const [pid,pname,area,goals] of SEED){
    d.projects.push({id:pid,name:pname,area,color:PROJ_COLOR[pid],icon:PROJ_ICON[pid],notes:'',description:''});
    for(const [oid,oname,hours,sections,deadline=''] of goals){
      const o={id:oid,project:pid,name:oname,icon:OBJ_ICON[oid]||'🎯',status:'Hoy',priority:'Normal',hours,phase:'',deadline,sections:[],sched:true};
      d.objectives.push(o);
      for(const [sec,...tasks] of sections){
        o.sections.push(sec);
        tasks.forEach(([n,m,sel],i)=>d.tasks.push({...mkTask(n,m,oid,sec),id:'pack-'+oid+'-'+slug(sec)+'-'+i,days:sel?[today]:[],deadline}));
      }
    }
  }
  const rank={'decision-reunion':0,'tax-quarter':1,'minor-journey':2,launch:3,dryer:4};
  d.order[today]=d.tasks.filter(t=>t.days.includes(today)).sort((a,b)=>(rank[a.objective]??9)-(rank[b.objective]??9)).map(t=>t.id);
  return d;
}
function normalizeSections(d){
  for(const o of d.objectives){
    const known=new Set(o.sections);
    for(const t of d.tasks)if(t.objective===o.id&&t.section&&!known.has(t.section)){o.sections.push(t.section);known.add(t.section);}
  }
}

  data:{"secs": ["Preparación en Flodesk", "Base técnica", "Las cinco pruebas", "Decisión"], "tasks": [["Preparación en Flodesk", "Generar la clave de API de Flodesk y guardarla en un lugar seguro", 10, "En Flodesk: Ajustes de cuenta → Integraciones → API keys → crear una clave nueva llamada «Prueba Fuego & Corazón».\n\nGuárdala en tu gestor de contraseñas. No la pegues en el chat ni en el código de la web: irá solo en el servidor (variable secreta). Si se expone, se borra y se crea otra."], ["Preparación en Flodesk", "Crear los campos personalizados de prueba en Flodesk", 10, "Crear dos campos personalizados (Audience → Custom fields):\n• fc_token: token firmado de cada persona (lo generará el servidor).\n• idioma_email: es / fr / en.\n\nApunta el nombre exacto de cada campo: lo necesitaremos para la API y para la etiqueta de combinación en el email."], ["Preparación en Flodesk", "Crear los segmentos de prueba", 10, "Crear tres segmentos con el prefijo TEST para no mezclarlos con los reales:\n• TEST Fuego & Corazón (la suscripción única)\n• TEST Diario\n• TEST Idioma FR\n\nApunta sus IDs más adelante (los verá la página de prueba con «Listar segmentos»)."], ["Preparación en Flodesk", "Crear el workflow «TEST Recorrido» con 3 emails cortos", 30, "Workflow de prueba:\n1. Email «Día 1» → espera (la más corta que permita Flodesk) → «Día 2» → espera → «Día 3».\n2. En la configuración del workflow, activar que los suscriptores puedan volver a entrar (re-entrada). Sin esto no se puede probar «Empezar de nuevo».\n3. Terminar con un paso de salida.\n4. En el email «Día 1», añadir un botón cuya URL use el campo fc_token, por ejemplo:\n   https://christianmisch.com/fc/prueba?t={{fc_token}}\n   (usa la etiqueta de combinación que Flodesk ofrezca para ese campo).\n5. Publicar el workflow sin disparador automático: entrará la gente solo por API."], ["Preparación en Flodesk", "Preparar dos direcciones de email de prueba", 5, "Una de Gmail y otra distinta (Outlook, iCloud…). Así vemos cómo se ven el botón y el enlace en dos clientes de correo."], ["Base técnica", "[Con Claude] Crear la tabla de prueba en Supabase", 30, "PROMPT PARA CLAUDE:\n\nEn el proyecto de Supabase de Fuego & Corazón (no el de Focus), crea una tabla de prueba `fc_test_contacts` con: id (uuid), email, nombre, idioma_web, idioma_web_origen (navegador|elegido), idioma_email, flodesk_id, token, created_at, updated_at. Y una tabla `fc_test_events` para registrar cada acción (tipo, contacto, payload, resultado, fecha). Activa RLS sin políticas públicas: solo el servidor escribe. Dame el SQL listo para pegar en el editor SQL de Supabase y explícame en dos líneas qué hace cada tabla."], ["Base técnica", "[Con Claude] Crear la función de servidor que habla con la API de Flodesk", 60, "PROMPT PARA CLAUDE:\n\nCrea una Supabase Edge Function `flodesk-test` que guarde la clave de API de Flodesk como secreto (FLODESK_API_KEY) y exponga estas acciones: crear o actualizar suscriptor con campos personalizados (fc_token, idioma_email), listar segmentos, añadir a segmentos, quitar de segmentos, listar workflows, añadir a workflow, quitar de workflow, dar de baja y consultar un suscriptor. El token debe ser un HMAC del id del contacto con un secreto propio (FC_TOKEN_SECRET), y la función debe validarlo antes de ejecutar acciones desde la página. Registra cada llamada en fc_test_events. Respeta los límites de Flodesk (100 peticiones/minuto). Dame los pasos exactos para desplegarla y configurar los secretos."], ["Base técnica", "[Con Claude] Construir la página HTML de prueba con los botones", 60, "PROMPT PARA CLAUDE:\n\nConstruye una página HTML sencilla y bonita, coherente con el estilo de christianmisch.com, en /fc/prueba. Lee el parámetro ?t= de la URL y muestra: nombre, email, idioma, segmentos actuales y estado. Botones: «Activar/desactivar diario», «Cambiar idioma de los emails a FR», «Empezar el recorrido», «Dejar el recorrido», «Empezar de nuevo», «Darme de baja de todo» y «Recargar estado». Cada botón llama a la función flodesk-test y muestra el resultado (éxito o error con el mensaje de Flodesk). Añade un bloque de registro visible con las últimas acciones para poder depurar. Sin la clave de Flodesk en el navegador."], ["Las cinco pruebas", "Prueba 1 · Crear un suscriptor por API con sus campos", 15, "Desde la página de prueba (o con la función), crear tu email de prueba con nombre, idioma_email = es y su fc_token.\n\nComprobar en el panel de Flodesk que aparece el suscriptor con los campos rellenos y en el segmento «TEST Fuego & Corazón».\n\n✓ Superada si los campos se ven en la ficha del suscriptor."], ["Las cinco pruebas", "Prueba 2 · El token en la URL del botón (la decisiva)", 30, "1. Meter al suscriptor de prueba en «TEST Recorrido» y abrir el email «Día 1» en Gmail.\n2. Mantener pulsado el botón y copiar el enlace: debe llevar ?t= seguido del token real, no la etiqueta vacía.\n3. Repetir con una campaña normal (no workflow) que tenga el mismo botón.\n4. Abrirlo en móvil y en ordenador.\n\n✓ Superada si en ambos casos el enlace abre la página con los datos de esa persona.\n✗ Si no funciona: plan B = enlace sin token + verificación con código por email (Supabase Auth). Anotar el resultado en «Decisión»."], ["Las cinco pruebas", "Prueba 3 · Los botones cambian Flodesk de verdad", 30, "Pulsar cada botón de la página y comprobar en el panel de Flodesk:\n• Activar/desactivar diario → entra/sale de «TEST Diario».\n• Cambiar idioma → idioma_email = fr y segmento «TEST Idioma FR».\n• Dejar el recorrido → sale del workflow y no llega el siguiente email.\n• Baja de todo → estado «unsubscribed».\n\n✓ Superada si cada cambio se ve en Flodesk en menos de un minuto."], ["Las cinco pruebas", "Prueba 4 · Empezar de nuevo un recorrido", 20, "Con el suscriptor dentro o al final de «TEST Recorrido», pulsar «Empezar de nuevo» (la función lo retira y lo vuelve a añadir).\n\n✓ Superada si vuelve a llegar el email «Día 1».\n✗ Si Flodesk da error: revisar que el workflow permite re-entrada y que el suscriptor no siga activo en él."], ["Las cinco pruebas", "[Con Claude] Prueba 5 · La baja nativa de Flodesk actualiza Supabase", 30, "PROMPT PARA CLAUDE:\n\nAñade a la función un endpoint para el webhook de Flodesk «subscriber.unsubscribed» que marque al contacto como dado de baja en fc_test_contacts y lo registre en fc_test_events. Dime cómo configurar el webhook en Flodesk y cómo verificar que la petición viene de Flodesk.\n\nLuego: darse de baja desde el enlace del pie de un email de prueba y comprobar que Supabase lo refleja.\n\n✓ Superada si el cambio aparece en la tabla."], ["Las cinco pruebas", "Abrir la página desde el móvil: Gmail, iPhone y Android", 20, "Abrir el enlace con token desde la app de Gmail en iPhone y en Android, y desde el navegador del ordenador. Comprobar que carga, que se ve bien y que los botones responden. Apuntar cualquier diferencia."], ["Decisión", "Anotar resultados y límites encontrados", 15, "Para cada prueba: superada / no superada / con matices, y qué límite de Flodesk apareció. Especialmente la Prueba 2: decide si la cuenta se abre con token o con código por email."], ["Decisión", "[Con Claude] Cerrar la arquitectura y actualizar el documento de traspaso", 30, "PROMPT PARA CLAUDE:\n\nTe paso los resultados de las cinco pruebas de la API de Flodesk. Con ellos, cierra la arquitectura de Fuego & Corazón (Flodesk + Supabase + web + YouTube + S3), dime qué cambia respecto a lo previsto y actualiza el documento de traspaso del proyecto con las decisiones tomadas y lo que queda abierto. Después borra o archiva lo que sea solo de prueba (segmentos TEST, workflow TEST, tablas fc_test_*)."]]}},
{id:'seguridad-lanzamiento',projectMatch:'fuego',projectName:'Fuego y Corazón',area:'Ministerio',

  data:{"secs": ["Base de datos y permisos", "Claves y secretos", "Cuentas y accesos", "Registro y enlaces", "Datos y privacidad", "Copias y vigilancia", "Revisión final"], "tasks": [["Base de datos y permisos", "[Con Claude] Crear las tablas con RLS activada desde el primer momento", 45, "PROMPT PARA CLAUDE:\n\nVoy a crear las tablas de Fuego & Corazón en Supabase (perfiles, consentimientos, inscripciones a recorridos, progreso por día, eventos de actividad, reglas por tema, registro de automatizaciones, reportes de comentarios). Dame el SQL con RLS activada en TODAS las tablas desde la creación. Reglas: las tablas de eventos, consentimientos, reportes y registro de automatizaciones no tienen ninguna política pública y solo las escribe el servidor; cada persona solo puede leer y modificar sus propios datos de perfil y progreso (auth.uid() = user_id). Explícame en una línea qué protege cada política."], ["Base de datos y permisos", "[Con Claude] Auditar las reglas RLS y probar que nada queda abierto", 40, "PROMPT PARA CLAUDE:\n\nTe pego las políticas RLS y la lista de tablas del proyecto. Audítalas: busca tablas sin RLS, políticas demasiado permisivas, vistas que salten las reglas y funciones con permisos de más. Después dame consultas para probar desde la clave pública (anon) y desde la sesión de una persona normal que NO puede leer datos ajenos ni escribir en las tablas del servidor.\n\nLuego, en Supabase: abrir Advisors → Security Advisor y corregir todo lo que marque en rojo o naranja."], ["Base de datos y permisos", "Pasar el Security Advisor de Supabase y corregir los avisos", 20, "En el panel de Supabase busca «Advisors» → «Security». Debe marcar cero tablas sin RLS y cero avisos críticos.\n\nApunta los avisos que decidas ignorar y por qué."], ["Base de datos y permisos", "Escribir los eventos solo desde el servidor", 30, "Comprobar que el navegador nunca inserta directamente en la tabla de eventos: toda acción (ver página, descargar PDF, comentar) pasa por una función de servidor que valida la sesión y escribe el evento.\n\nAsí nadie puede falsear su actividad ni inundar la tabla."], ["Claves y secretos", "Guardar las claves solo en secretos del servidor", 25, "Lista de claves y dónde viven:\n• Clave de servicio de Supabase → secretos de las Edge Functions.\n• Clave de API de Flodesk → secretos de las Edge Functions.\n• Secreto de los tokens (HMAC) → secretos de las Edge Functions.\n• Claves de AWS (S3) → solo en el servidor, con permisos mínimos.\n\nNinguna en el navegador, ninguna en GitHub. Solo la clave pública (anon) puede estar en el código de la web."], ["Claves y secretos", "[Con Claude] Revisar el repositorio de la web en busca de claves expuestas", 20, "PROMPT PARA CLAUDE:\n\nRevisa el repositorio de la web (y el historial reciente de commits) buscando claves, tokens, contraseñas o URLs con credenciales. Dime qué hay que cambiar y cómo mover cada secreto a variables de entorno. Comprueba también que .gitignore excluye los archivos de configuración local.\n\nSi aparece alguna clave real, la cambias ese mismo día."], ["Claves y secretos", "Activar el análisis de secretos de GitHub", 10, "En el repositorio: Settings → Code security → activar «Secret scanning» y «Push protection». GitHub avisará, o bloqueará el commit, si alguien intenta subir una clave."], ["Claves y secretos", "Anotar cuándo y cómo se cambia cada clave", 15, "Una nota con el procedimiento de rotación de cada clave (dónde se genera, dónde se actualiza, qué se prueba después). Así, si una se filtra, cambiarla lleva minutos y no horas buscando."], ["Cuentas y accesos", "Activar la verificación en dos pasos en todas las cuentas", 30, "Activar 2FA, mejor con passkey o app de autenticación, en:\n• Supabase\n• GitHub\n• AWS (con usuario IAM, no con la cuenta raíz para el día a día)\n• Flodesk\n• Cloudflare / dominio\n• El correo con el que recuperas todo lo anterior\n\nGuarda los códigos de recuperación fuera del ordenador."], ["Cuentas y accesos", "Poner un gestor de contraseñas y cambiar las repetidas", 30, "Contraseñas únicas y largas para cada servicio, guardadas en un gestor. Empieza por las cuentas de la lista anterior."], ["Cuentas y accesos", "Dar a AWS solo los permisos mínimos para S3", 20, "Crear un usuario o rol que solo pueda leer y escribir en el bucket de los PDFs y audios, y nada más. El bucket debe estar privado (sin acceso público). Revisar también que la cuenta raíz tiene 2FA y no se usa."], ["Registro y enlaces", "Activar el captcha en el registro", 20, "En Supabase: Authentication → Attack Protection (o ajustes de seguridad) → activar CAPTCHA con Cloudflare Turnstile o hCaptcha. Añadir el widget al formulario de registro y probar que un registro normal sigue funcionando."], ["Registro y enlaces", "Ajustar la caducidad y los límites de los códigos de acceso", 15, "En Authentication, revisar:\n• Caducidad del código por email: de pocos minutos.\n• Límites de envíos de email y de intentos por hora.\n\nProbar: pedir varios códigos seguidos y comprobar que el sistema frena el abuso."], ["Registro y enlaces", "[Con Claude] Definir qué puede hacer cada tipo de enlace", 40, "PROMPT PARA CLAUDE:\n\nDiseña las reglas de los enlaces con token de los emails: token firmado (HMAC) con caducidad, que SOLO permite ver el progreso y cambiar preferencias. Comentar, descargar PDFs y borrar la cuenta exigen sesión iniciada. Incluye qué pasa si un email se reenvía, cómo se invalida un token y cómo se pide un código cuando el token caduca. Dame el código de validación para la Edge Function."], ["Registro y enlaces", "Enlaces de descarga de PDFs con caducidad", 30, "Los PDFs en S3 privado se descargan con enlaces firmados que caducan en pocos minutos y solo se generan para personas con sesión iniciada. Probar que el enlace deja de funcionar pasado el tiempo y que no se puede adivinar la dirección del archivo."], ["Datos y privacidad", "Decidir qué datos se guardan y cuáles no", 30, "Hacer la lista de los datos que laude] Crear alertas de actividad extraña", 45, "PROMPT PARA CLAUDE:\n\nCrea una función programada que cada hora revise: picos de registros, picos de lecturas en tablas sensibles, muchos códigos pedidos desde la misma dirección y accesos fallidos repetidos. Si algo supera los umbrales, que me envíe un email de alerta. Dame los umbrales iniciales y cómo ajustarlos."], ["Copias y vigilancia", "Escribir el plan de actuación ante una filtración", 45, "Una página con los pasos: 1) cortar el acceso (cambiar claves y cerrar sesiones), 2) saber qué datos se vieron, 3) avisar a las personas afectadas, 4) avisar a la autoridad en un máximo de 72 horas si hay riesgo (AEPD en España), 5) corregir y documentar.\n\nIncluye los teléfonos y enlaces que necesitarás."], ["Revisión final", "[Con Claude] Revisión completa de seguridad antes de lanzar", 60, "PROMPT PARA CLAUDE:\n\nHaz una revisión final de seguridad del sistema de Fuego & Corazón antes del lanzamiento. Repasa: RLS de todas las tablas, secretos y claves, permisos de AWS y del bucket, enlaces con token, registro con captcha, borrado de cuenta, copias y alertas. Intenta saltarte las reglas con la clave pública y con la sesión de una persona normal. Dame un informe con lo que pasa, lo que no pasa y lo que queda por corregir."], ["Revisión final", "Marcar como superada la lista y fijar la fecha de lanzamiento", 15, "Solo se lanza con todas las tareas de este objetivo hechas o con una decisión escrita sobre cada pendiente.\n\nAnotar fecha de la revisión y quién la hizo."]]}},

function evalMin(v,base){
  const x=v.trim().toLowerCase().replace(/,/g,'.').replace(/\s+/g,'').replace(/(min|m)$/,'');
  if(/^[+\-]?\d+(\.\d+)?([+\-]\d+(\.\d+)?)*$/.test(x)){
    const sum=x.match(/[+\-]?\d+(\.\d+)?/g).reduce((q,n)=>q+ +n,0);
    return /^[+\-]/.test(x)?base+sum:sum;
  }
  return parseMin(v);
}
function setWorked(id,m){

  else{let rem=-diff;
    {const re=s.entries.find(x=>x.task===id&&x.end==null);if(re){const take=Math.min(rem,Math.max(0,Date.now()-re.start));re.start+=take;rem-=take;}}
    for(const e of s.entries.filter(x=>x.task===id&&x.end!=null).sort((x,y)=>y.start-x.start)){if(rem<=0)break;const d=e.end-e.start;if(d<=rem){s.entries=s.entries.filter(x=>x!==e);rem-=d;}else{e.end-=rem;rem=0;}}}
  (s.adjLog??=[]).push({task:id,at:Date.now(),from:Math.round(cur/60000),to:m});
}

function removeFresh(id){s.tasks=s.tasks.filter(t=>t.id!==id);fresh.delete(id);if(chainId===id)chainId='';}
function commitEdit(el,info){
  const kind=el.dataset.edit,id=el.dataset.id,orig=(el._orig??'').trim();
  const v=el.textContent.replace(/\s+/g,' ').trim();
  if(kind==='task.name'&&fresh.has(id)){
    if(!v){if(info.winBlur)return;removeFresh(id);save(false);soon();return;}
    fresh.delete(id);
  }
  if(info.cancel){el.textContent=el._orig;return;}
  if(v===orig&&!(info.enter&&kind==='task.name'&&chainId===id)&&!(info.enter&&kind==='sec.name'&&v))return;
  let bad=false;
  switch(kind){
    case 'task.name':{const t=task(id);if(!t)return;if(!v)bad=true;else t.name=v;break;}
    case 'task.worked':{const t=task(id);if(!t)return;const cur=workedMin(t),base=Math.floor(cur+1e-6),m=evalMin(v,base);if(m==null||m>10080){notify('Escribe el tiempo en minutos. Puedes sumar o restar: 50-15 o +15.');bad=true;}else setWorked(id,Math.max(0,m)+(cur-base));break;}
    case 'task.min':{const t=task(id),m=parseMin(v);if(!t)return;if(m==null||m<1||m>10080){notify('Escribe una duración válida, por ejemplo 45, 1h30 o 90m.');bad=true;}else t.minutes=m;break;}
    case 'sec.name':{
      const o=objective(id),old=el.dataset.sec;if(!o||old===RECUR||v===RECUR){if(v===RECUR&&old!==RECUR)notify('Ese nombre está reservado para las tareas recurrentes.');bad=true;break;}
      if(!v)bad=true;
      else if(v!==old){
        if(o.sections.includes(v)){notify('Ya existe una sección con ese nombre.');bad=true;}
        else{if(o.secWin?.[old]){o.secWin[v]=o.secWin[old];delete o.secWin[old];}o.sections=o.sections.map(x=>x===old?v:x);s.tasks.forEach(t=>{if(t.objective===nobj(id)&&t.section===old)t.section=v;});}
      }
      break;}
    case 'obj.desc':{const o=objective(id);if(o){const d=v.replace(/\s+/g,' ').trim();if(d)o.desc=d;else delete o.desc;}break;}
    case 'obj.name':{const o=objective(id);if(!v)bad=true;else if(o)o.name=v;break;}
    case 'obj.hours':{const o=objective(id),n=parseFloat(v.replace(',','.'));if(!Number.isFinite(n)||n<0||n>168)bad=true;else if(o)o.hours=n;break;}
    case 'obj.phase':{const o=objective(id);if(o)o.phase=v;break;}
    case 'proj.name':{const p=project(id);if(!v)bad=true;else if(p)p.name=v;break;}
    case 'proj.desc':{const p=project(id);if(p)p.description=v;break;}
    case 'inbox.text':{const i=s.inbox.find(x=>x.id===id);if(!v)bad=true;else if(i)i.text=v;break;}
  }
  if(bad){el.textContent=el._orig;soon();return;}
  if(info.enter&&kind==='task.name'&&chainId===id){
    const t=task(id);
    save(false);
    addTask(t.objective,t.section,t.id,!!info.inToday);
    return;
  }
  if(info.enter&&kind==='sec.name'){
    const o=objective(id),name=o&&(o.sections.includes(v)?v:el.dataset.sec);
    if(o&&name&&name!==RECUR){
      const mine=s.tasks.filter(x=>x.objective===nobj(id)&&x.section===name&&!x.done);
      save(false);
      if(mine.length){focusAfter={kind:'task.name',id:mine[0].id};render();}
      else addTask(nobj(id),name,'',false);
      return;
    }
  }
  save(false);soon();
}
function addTask(objId,sec,afterId='',today=false,beforeId=''){
  const t=mkTask('',10,objId,sec),ref=afterId||beforeId;

const FILL=/\b(bueno|pues|o sea|a ver|es que|la verdad|básicamente|básicamente|simplemente|igual|digamos|tipo|vale|oye|mira|eh+|mmm+|um+)\b[,]?\s*/gi;
const LEAD=/^(tengo que|tendría que|tengo que acordarme de|acordarme de|recordar|recuérdame|recuerda|necesito|me gustaría|quiero|hay que|debería|habría que)\s+/i;
const capz=t=>t.charAt(0).toUpperCase()+t.slice(1);
function simplifyText(t){
  let r=t.replace(/\s+/g,' ').trim().replace(FILL,'').replace(/\s+([,.;])/g,'$1').replace(/^[,.;\s]+/,'').trim();
  return capz(r);
}
function synthText(t){
  let r=simplifyText(t).replace(LEAD,'');
  const first=r.split(/(?<=[.!?])\s+|;\s+/)[0];
  if(first.split(' ').length>=6)r=first;
  const w=r.split(' ');if(w.length>14){const c=r.split(',')[0];r=c.split(' ').length>=5?c:w.slice(0,14).join(' ')+'…';}
  return capz(r.replace(/[.]$/,''));
}
function splitIdeas(t){
  return t.split(/\n+|(?<=[.!?])\s+|;\s*|,?\s+(?:y luego|y después|y también|además|también tengo que|and then|also)\s+/i).map(x=>capz(x.replace(/^[,.\s]+|[.\s]+$/g,'').trim())).filter(x=>x.length>2);
